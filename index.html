<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои языки — китайский и английский</title>
<meta name="description" content="Бесплатный тренажёр китайского и английского: 5000+ слов HSK 1–3 и 3000 важных английских слов, книги с переводом, диалоги, тоны и ИИ-учитель.">
<meta property="og:title" content="Мои языки — китайский и английский">
<meta property="og:description" content="Карточки, книги с переводом, диалоги, тренажёр тонов и ИИ-учитель.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%88%B6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1b18; --muted:#6f6a61; --line:#e4dfd5;
  --accent:#c8372d; --accent-soft:#f9e4e1; --good:#2f7d4f; --good-soft:#e1f1e7; --warn:#b7791f;
  --radius:16px;
}
.en{--accent:#2b5cab; --accent-soft:#e2eaf7;}
@media (prefers-color-scheme:dark){
  :root{--bg:#15140f; --card:#211f1a; --ink:#f1ede4; --muted:#a39d91; --line:#36332c;
    --accent-soft:#3a1f1c; --good-soft:#1b3326;}
  .en{--accent-soft:#1c2840;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--muted)}
.langs{display:flex;gap:8px}
.lang{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;font-weight:600}
.lang.on{background:var(--accent);border-color:var(--accent);color:#fff}
nav.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
nav.tabs{overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:1 0 auto;white-space:nowrap;border:0;background:none;color:var(--muted);padding:9px 8px;border-radius:9px;cursor:pointer;font:inherit;font-weight:600;font-size:13px;min-width:0}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.deck{border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:var(--card);text-align:left;font:inherit;color:inherit}
.deck:hover{border-color:var(--accent)}
.deck.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.deck h3{margin:0 0 4px;font-size:15px}
.deck small{color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:9px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.btn{border:0;background:var(--accent);color:#fff;padding:12px 18px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.flash{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;user-select:none;padding:10px}
.big{font-size:64px;line-height:1.1;font-weight:500}
.zh .big{font-family:"Noto Sans SC",sans-serif;font-size:84px}
.en .big{font-size:44px;font-weight:700}
.sub{color:var(--muted);font-size:18px}
.mean{font-size:22px;font-weight:600}
.ex{color:var(--muted);font-size:15px;max-width:520px}
.ex .zhx{font-family:"Noto Sans SC",sans-serif;color:var(--ink);font-size:18px}
.hint{font-size:13px;color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grades button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 4px;font:inherit;font-weight:600;cursor:pointer}
.grades button small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.grades .g0{border-color:#d9534f55}.grades .g3{border-color:#2f7d4f66}
.speak{border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:999px;width:42px;height:42px;cursor:pointer;font-size:18px}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px;text-align:left;font:inherit;cursor:pointer}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:#d9534f22;border-color:#d9534f}
.opt .zhx{font-family:"Noto Sans SC",sans-serif;font-size:22px}
.progress{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
input.type{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:18px;background:var(--bg);color:var(--ink)}
.list{display:grid;gap:6px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.item .w{font-weight:600;min-width:70px}
.zh .item .w{font-family:"Noto Sans SC",sans-serif;font-size:22px}
.item .m{color:var(--muted);font-size:14px}
.lvl{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--muted);white-space:nowrap}
.lvl.l2{background:#b7791f22;color:var(--warn)}
.lvl.l3{background:var(--good-soft);color:var(--good)}
.muted{color:var(--muted)}
.done{font-size:48px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.sent{font-size:30px;line-height:1.35;font-weight:600;text-align:center}
.zh .sent{font-family:"Noto Sans SC",sans-serif;font-size:36px;font-weight:500}
.slot{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.slot.ok{border-color:var(--good);background:var(--good-soft)}
.slot.bad{border-color:#d9534f;background:#d9534f14}
.tok{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px;font:inherit;font-size:18px;cursor:pointer}
.zh .tok{font-family:"Noto Sans SC",sans-serif;font-size:22px}
.tok.used{visibility:hidden}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.modes button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px;font:inherit;font-weight:600;cursor:pointer;font-size:14px}
.modes button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
/* --- голос --- */
.speak.slow{font-size:16px}
.speak.playing{background:var(--accent);color:#fff;border-color:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.speak.playing{animation:none}}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:40px;height:40px;cursor:pointer;font-size:17px}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
@media(min-width:600px){.modal{align-items:center}}
.sheet{background:var(--card);color:var(--ink);border-radius:18px;max-width:520px;width:100%;padding:20px;max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:19px}
.field{margin-top:16px}
.field>label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.sheet select,.sheet input[type=range]{width:100%;font:inherit;font-size:16px}
.sheet select{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.ok-note{font-size:13px;color:var(--good)}.warn-note{font-size:13px;color:var(--warn)}
/* --- ИИ --- */
.ai-box{margin-top:12px;padding:14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);text-align:left;font-size:15px;line-height:1.6;width:100%;max-width:560px}
.ai-box .zhx{font-family:"Noto Sans SC",sans-serif;font-size:18px}
.ai-box p{margin:0 0 8px}.ai-box p:last-child{margin:0}
.chat{display:flex;flex-direction:column;gap:10px;min-height:240px;max-height:56vh;overflow:auto;padding:4px 2px 8px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .say{display:block;font-size:19px;font-weight:600;margin:2px 0}
.zh .msg .say{font-family:"Noto Sans SC",sans-serif;font-size:22px;font-weight:500}
.msg .tools{display:flex;gap:6px;margin-top:6px}
.msg .speak{width:34px;height:34px;font-size:15px}
.composer{display:flex;gap:8px;margin-top:10px}
.composer input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink)}
.mic.on{background:#d9534f;color:#fff;border-color:#d9534f}
.typing{color:var(--muted);font-style:italic}
.gchips .chip small{font-weight:400}
.deck .preview{font-size:14px;color:var(--muted);margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zh .deck .preview{font-family:"Noto Sans SC",sans-serif;font-size:16px;color:var(--ink)}
.alist{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.aitem{flex:0 0 auto;max-width:220px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit}
.aitem span{display:block;font-size:12px;color:var(--muted)}.aitem b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zh .aitem b{font-family:"Noto Sans SC",Inter,sans-serif}
.aitem.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.kctl{gap:6px;margin-top:12px}.kctl .chip{margin:0}
.klines{margin-top:14px;display:grid;gap:4px}
.kline{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:background .2s,border-color .2s}
.kline:hover{background:var(--bg)}
.kline.now{background:var(--accent-soft);border-color:var(--accent)}
.kline.now .kw{color:var(--accent)}
.kline.sp-B{flex-direction:row-reverse;text-align:right}
.spk{font-size:20px;line-height:1.4}
.kbody{flex:1;min-width:0}
.kw{font-size:20px;font-weight:600;line-height:1.45}
.zh .kw{font-family:"Noto Sans SC",sans-serif;font-size:26px;font-weight:500;letter-spacing:.04em}
.kt{color:var(--muted);font-size:15px}.km{font-size:15px;margin-top:2px}
.hidden-t{color:var(--muted);font-weight:400;font-size:15px}
.blank{border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 4px;margin:0 1px;font:inherit;cursor:pointer;letter-spacing:.1em}
.trow{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:10px}
.tbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;width:58px;height:58px;cursor:pointer;font:inherit}
.tbtn b{display:block;font-size:24px;line-height:1}.tbtn small{font-size:11px;color:var(--muted)}
.tbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.tbtn.right{border-color:var(--good);background:var(--good-soft)}.tbtn.wrong{border-color:#d9534f;background:#d9534f22}
@media (prefers-reduced-motion:no-preference){.kline.now{animation:glow 1.6s ease-in-out infinite}}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--accent-soft)}}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.book{border:0;background:none;padding:0;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.cover{position:relative;aspect-ratio:3/4;border-radius:6px 14px 14px 6px;padding:14px 12px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 78%,#fff) 0%,var(--c) 45%,color-mix(in srgb,var(--c) 70%,#000) 100%);
  box-shadow:inset 6px 0 0 rgba(0,0,0,.18),inset 8px 0 0 rgba(255,255,255,.12),0 6px 16px -6px rgba(0,0,0,.45);transition:transform .2s}
.book:hover .cover{transform:translateY(-3px) rotate(-.5deg)}
.cover .bemoji{position:absolute;top:12px;right:12px;font-size:38px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.cover b{font-size:17px;line-height:1.15;text-wrap:balance}.zh .cover b{font-family:"Noto Sans SC",sans-serif;font-size:21px;font-weight:700}
.cover i{font-style:normal;font-size:12px;opacity:.85;line-height:1.3}
.bprog{height:4px;background:rgba(255,255,255,.3);border-radius:9px;margin-top:6px;overflow:hidden}.bprog span{display:block;height:100%;background:#fff}
.bmeta{font-size:12px;color:var(--muted);margin-top:6px}
.reader{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 10px;border-top:6px solid var(--c)}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.rhead .chip{margin:0}
.rtitle{display:flex;gap:14px;align-items:center;margin:14px 0 6px}.rtitle .bemoji{font-size:44px}
.rtitle h2{margin:0;font-size:24px;line-height:1.15}.zh .rtitle h2{font-family:"Noto Sans SC",sans-serif;font-size:28px}
.rctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 4px;position:sticky;top:0;background:var(--card);padding:8px 0;z-index:5}.rctl .chip{margin:0}
.rtext{font-size:calc(19px + var(--fs)*2px);line-height:1.75;font-family:Georgia,"Times New Roman",serif;margin-top:8px}
.zh .rtext{font-family:"Noto Sans SC",sans-serif;font-size:calc(22px + var(--fs)*2px);line-height:1.9}
.rtext p{margin:0 0 1em;text-indent:1.2em}
.bs{border-radius:6px;cursor:pointer;transition:background .2s}
.bs.now{background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.bs.sel{background:color-mix(in srgb,var(--warn) 18%,transparent)}
.blk{display:block;padding:6px 8px;margin:0 -8px}.bgap{height:14px}
.bpin{font-family:Inter,sans-serif;font-size:14px;color:var(--muted);line-height:1.5}
.btr{font-family:Inter,sans-serif;font-size:14px;color:var(--ink);opacity:.8;line-height:1.5;margin-top:2px}
.bw{border-radius:4px;transition:background .15s}.bw:hover{background:var(--accent-soft);color:var(--accent)}
.sheetbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);max-height:58vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);padding:16px 16px 20px;z-index:40}
.sclose{position:absolute;top:10px;right:10px;width:34px;height:34px;font-size:14px}
.wbox{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-right:36px}
.wbig{font-size:26px;font-weight:700}.zh .wbig{font-family:"Noto Sans SC",sans-serif;font-size:32px;font-weight:500}
.wmean{font-size:18px;margin-top:4px}
.sline{font-size:18px;font-weight:600;padding-right:36px}.zh .sline{font-family:"Noto Sans SC",sans-serif;font-size:22px;font-weight:500}
.reader.hasSheet{margin-bottom:52vh}
.ptext{width:100%;min-height:64px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,monospace}
.foot{margin-top:40px;font-size:12px;color:var(--muted);line-height:1.6}.foot a{color:inherit}
.custom-x{float:right;border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 2px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div>
      <h1>Мои языки</h1>
      <div class="sync" id="sync">Прогресс хранится в этом браузере</div>
    </div>
    <div class="langs">
      <button class="lang" data-lang="zh">🇨🇳 中文</button>
      <button class="lang" data-lang="en">🇬🇧 English</button>
      <button class="icon-btn" data-voiceset title="Настройки голоса">⚙️</button>
    </div>
  </header>
  <nav class="tabs">
    <button data-tab="home">Главная</button>
    <button data-tab="books">📚 Книги</button>
    <button data-tab="audio">🎧 Аудио</button>
    <button data-tab="ai">🤖 ИИ</button>
    <button data-tab="cards">Карточки</button>
    <button data-tab="phrases">Фразы</button>
    <button data-tab="quiz">Тест</button>
    <button data-tab="write">Написание</button>
    <button data-tab="words">Слова</button>
  </nav>
  <main id="view"></main>

</div>

<script src="config.js"></script>
<script>
/* Отдельная версия: вместо платформы claude.ai — свой сервер для ИИ, голос и микрофон браузера */
window.STANDALONE = true;
(function(){
  const AI_URL = (window.APP_CONFIG && window.APP_CONFIG.AI_URL || "").trim();
  function makeAI(){
    if(!AI_URL) return null;
    const call = async (input, opts={})=>{
      const messages = typeof input==="string" ? [{role:"user", content:input}] : input;
      let r;
      try{ r = await fetch(AI_URL, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({messages, json:!!opts.__json}), signal:opts.signal}); }
      catch(e){ throw {code:"network", message:"Нет связи с сервером ИИ"}; }
      if(r.status===429) throw {code:"rate_limited", message:"Слишком много запросов"};
      if(r.status===403) throw {code:"not_granted", message:"Сайт не допущен к серверу ИИ"};
      if(!r.ok) throw {code:"error", message:"Ошибка сервера ИИ"};
      const d = await r.json(); const text = String(d.text||"");
      if(opts.onText) opts.onText({text, delta:text});
      return {text, truncated:false};
    };
    call.json = async (input, opts={})=>{
      const {text} = await call(input, Object.assign({}, opts, {__json:true}));
      const m = text.match(/[\[{][\s\S]*[\]}]/);
      try{ return JSON.parse(m ? m[0] : text); }catch(e){ throw {code:"bad_json", message:"ИИ ответил не по формату"}; }
    };
    call.limits = async ()=>({images:false});
    return call;
  }
  function makeDictation(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if(!SR) return null;
    let rec=null; const h={p:[],f:[],s:[]};
    const emit=(k,v)=>h[k].forEach(fn=>{ try{fn(v)}catch(e){} });
    return {
      onPartial(fn){h.p.push(fn)}, onFinal(fn){h.f.push(fn)}, onState(fn){h.s.push(fn)},
      start(){

 ["The tortoise walks and walks. She does not stop.","Черепаха идёт и идёт. Она не останавливается.",1],
 ["She walks past the sleeping hare.","Она проходит мимо спящего зайца."],
 ["When the hare wakes up, he runs to the finish.","Когда заяц просыпается, он бежит к финишу."],
 ["But the tortoise is already there!","Но черепаха уже там!"],
 ["Slow and steady wins the race.","Тише едешь — дальше будешь.",1]]},
{id:"en-emperor", lvl:1, emoji:"👑", color:"#c8372d", title:"The Emperor's New Clothes", ru:"Новое платье короля", by:"по Гансу Христиану Андерсену, 1837 · адаптация A2", text:[
 ["There was once an emperor who loved new clothes.","Жил-был император, который любил новую одежду.",1],
 ["He spent all his money on them.","Он тратил на неё все свои деньги."],
 ["One day two men came to the city.","Однажды в город пришли двое мужчин.",1],
 ["\"We can make wonderful cloth,\" they said. \"But stupid people cannot see it.\"","«Мы умеем делать чудесную ткань, — сказали они. — Но глупые люди её не видят»."],
 ["The emperor gave them gold, and they started to work.","Император дал им золото, и они начали работать."],
 ["But there was no cloth. They only moved their hands in the air.","Но никакой ткани не было. Они только двигали руками в воздухе."],
 ["The emperor sent his minister to look.","Император послал министра посмотреть.",1],
 ["The minister saw nothing, but he was afraid to say it.","Министр ничего не увидел, но побоялся это сказать."],
 ["\"It is beautiful!\" he said.","«Это прекрасно!» — сказал он."],
 ["Then the emperor came. He saw nothing too.","Потом пришёл император. Он тоже ничего не увидел."],
 ["\"I am not stupid,\" he thought. \"I must see it!\" So he said, \"Wonderful!\"","«Я не глупый, — подумал он. — Я должен её видеть!» И сказал: «Чудесно!»"],
 ["On the day of the big parade, the emperor walked through the city in his \"new clothes\".","В день большого парада император прошёл по городу в своём «новом платье».",1],
 ["Everyone shouted, \"How beautiful!\"","Все кричали: «Как красиво!»"],
 ["Then a little child said, \"But he has nothing on!\"","И тут маленький ребёнок сказал: «А король-то голый!»"],
 ["Soon everyone was laughing.","Скоро смеялись все."],
 ["The emperor knew it was true, but he kept walking with his head high.","Император понял, что это правда, но продолжал идти с высоко поднятой головой."]]},
{id:"en-holmes", lvl:2, emoji:"🔎", color:"#3b4a63", title:"Sherlock Holmes: The Red-Headed League", ru:"Шерлок Холмс: Союз рыжих", by:"по Артуру Конан Дойлу, 1891 · адаптация B1", text:[
 ["One autumn morning, Dr Watson visited his friend Sherlock Holmes at 221B Baker Street.","Однажды осенним утром доктор Ватсон зашёл к своему другу Шерлоку Холмсу на Бейкер-стрит, 221Б.",1],
 ["Holmes was talking to a large man with bright red hair.","Холмс разговаривал с крупным мужчиной с ярко-рыжими волосами."],
 ["His name was Jabez Wilson, and he owned a small shop in London.","Его звали Джабез Уилсон, и у него была маленькая лавка в Лондоне."],
 ["\"It is the strangest story,\" Mr Wilson began.","«Это очень странная история», — начал мистер Уилсон.",1],
 ["Eight weeks earlier, his young assistant had shown him an advertisement in the newspaper.","Восемь недель назад его молодой помощник показал ему объявление в газете."],
 ["A rich organisation called the Red-Headed League was looking for a man with red hair.","Богатая организация под названием «Союз рыжих» искала человека с рыжими волосами."],
 ["The job was easy: he had to copy an encyclopaedia by hand, four hours a day.","Работа была простой: нужно было переписывать энциклопедию от руки, по четыре часа в день."],
 ["The pay was excellent, so Mr Wilson accepted.","Платили отлично, поэтому мистер Уилсон согласился."],
 ["For eight weeks he went to the office every morning and wrote for hours.","Восемь недель он каждое утро ходил в контору и часами писал.",1],
 ["Then one day he found a note on the door: \"The Red-Headed League is closed.\"","А потом однажды нашёл на двери записку: «Союз рыжих закрыт»."],
 ["Holmes smiled. \"This is a very interesting problem,\" he said.","Холмс улыбнулся. «Это очень интересная задача», — сказал он.",1],
 ["He asked about the assistant. \"He works for half the normal pay,\" said Wilson, \"and he spends hours in the basement.\"","Он расспросил о помощнике. «Он работает за полцены, — сказал Уилсон, — и проводит часы в подвале»."],
 ["Holmes went to look at the shop. He hit the pavement with his stick and looked at the bank next door.","Холмс пошёл посмотреть на лавку. Он постучал тростью по тротуару и взглянул на соседний банк."],
 ["That night Holmes, Watson and two policemen waited in the dark cellar of the bank.","Той ночью Холмс, Ватсон и двое полицейских ждали в тёмном подвале банка.",1],
 ["At midnight, a stone in the floor moved, and a hand appeared.","В полночь камень в полу сдвинулся, и появилась рука."],
 ["It was Wilson's assistant! He had dug a tunnel from the shop to the bank's gold.","Это был помощник Уилсона! Он прокопал туннель из лавки к золоту банка."],
 ["\"The League was only a trick,\" Holmes explained later, \"to keep Mr Wilson out of his shop.\"","«Союз был всего лишь уловкой, — объяснил потом Холмс, — чтобы мистер Уилсон уходил из лавки»."],
 ["Watson shook his head. \"Holmes, you are amazing.\"","Ватсон покачал головой. «Холмс, вы поразительны»."]]},
{id:"en-treasure", lvl:2, emoji:"🏴‍☠️", color:"#1f6f8b", title:"Treasure Island", ru:"Остров сокровищ", by:"по Роберту Льюису Стивенсону, 1883 · адаптация B1", text:[
 ["My name is Jim Hawkins. When I was a boy, my parents had an inn by the sea.","Меня зовут Джим Хокинс. Когда я был мальчиком, у моих родителей был трактир у моря.",1],
 ["One day an old sailor with a scar on his face came to stay.","Однажды к нам поселился старый моряк со шрамом на лице."],
 ["He carried a heavy sea chest and sang an old song about dead men and rum.","Он носил тяжёлый морской сундук и пел старую песню о мертвецах и роме."],
 ["He told me to watch for a sailor with one leg.","Он велел мне высматривать моряка на одной ноге."],
 ["The old sailor was afraid of something, and soon I learned why.","Старый моряк чего-то боялся, и скоро я узнал, чего.",1],
 ["One night his old pirate friends came for him, and the shock killed him.","Однажды ночью за ним пришли его старые друзья-пираты, и он умер от потрясения."],
 ["In his chest I found a map of an island.","В его сундуке я нашёл карту острова."],
 ["A red cross showed where Captain Flint had hidden his treasure.","Красный крестик показывал, где капитан Флинт спрятал свои сокровища."],
 ["My friends, the doctor and the squire, bought a ship called the Hispaniola.","Мои друзья, доктор и сквайр, купили корабль «Испаньола».",1],
 ["The ship's cook was a friendly man with one leg and a parrot. His name was Long John Silver.","Судовым коком был приветливый человек на одной ноге и с попугаем. Его звали Долговязый Джон Сильвер."],
 ["I liked him very much at first.","Сначала он мне очень нравился."],
 ["Near the end of our voyage, I climbed into a barrel of apples.","Под конец плавания я залез в бочку с яблоками.",1],
 ["From inside it, I heard Silver talking quietly to the sailors.","Изнутри я услышал, как Сильвер тихо разговаривает с матросами."],
 ["He was planning to take the treasure and kill us all!","Он задумал забрать сокровища и убить нас всех!"],
 ["My heart was beating fast. I had to warn my friends.","Сердце у меня колотилось. Я должен был предупредить друзей."],
 ["The next morning someone shouted, \"Land ho!\" Treasure Island was in front of us.","На следующее утро кто-то крикнул: «Земля!» Перед нами был Остров сокровищ."]]},
{id:"en-time", lvl:2, emoji:"⏳", color:"#6b5b95", title:"The Time Machine", ru:"Машина времени", by:"по Герберту Уэллсу, 1895 · адаптация B1", text:[
 ["Every Thursday, a group of friends had dinner at the home of a clever scientist.","Каждый четверг компания друзей ужинала в доме одного талантливого учёного.",1],
 ["We called him the Time Traveller.","Мы называли его Путешественником во времени."],
 ["One evening he showed us a small, shining machine.","Однажды вечером он показал нам маленькую сияющую машину."],
 ["\"This machine can travel through time,\" he said. Nobody believed him.","«Эта машина может путешествовать во времени», — сказал он. Никто ему не поверил."],
 ["A week later, he arrived late to dinner.","Через неделю он опоздал к ужину.",1],
 ["His clothes were dirty, and he looked tired and pale.","Его одежда была грязной, а сам он выглядел усталым и бледным."],
 ["\"I have been to the year 802,701,\" he told us.","«Я побывал в 802 701 году», — сказал он нам."],
 ["In the future, he said, the world looked like a huge garden.","В будущем, по его словам, мир был похож на огромный сад.",1],
 ["Small, gentle people called the Eloi lived there. They played, ate fruit and never worked.","Там жили маленькие кроткие люди — элои. Они играли, ели фрукты и никогда не работали."],
 ["But they were afraid of the dark.","Но они боялись темноты."],
 ["Soon he discovered why.","Скоро он узнал почему."],
 ["Under the ground lived the Morlocks — pale creatures who could not stand the light.","Под землёй жили морлоки — бледные существа, которые не выносили света.",1],
 ["At night they came up and hunted the Eloi.","По ночам они поднимались наверх и охотились на элоев."],
 ["When the Time Traveller returned to his machine, it was gone. The Morlocks had taken it!","Когда Путешественник вернулся к машине, её не было. Её забрали морлоки!"],
 ["He fought them in the dark and finally escaped back to our time.","Он сражался с ними в темноте и наконец сбежал обратно в наше время."],
 ["The next day he left again on his machine. He never came back.","На следующий день он снова отправился в путь на своей машине. Он так и не вернулся.",1]]},
{id:"en-robin", lvl:2, emoji:"🏹", color:"#3f7d3a", title:"Robin Hood", ru:"Робин Гуд", by:"английская легенда · адаптация B1", text:[
 ["Long ago, in the forest of Sherwood, lived a man called Robin Hood.","Давным-давно в Шервудском лесу жил человек по имени Робин Гуд.",1],
 ["He was the best archer in England.","Он был лучшим лучником в Англии."],
 ["Robin and his friends took money from the rich and gave it to the poor.","Робин и его друзья отбирали деньги у богатых и отдавали бедным."],
 ["The cruel Sheriff of Nottingham hated him and wanted to catch him.","Жестокий шериф Ноттингема ненавидел его и хотел поймать."],
 ["One day the Sheriff had an idea.","Однажды у шерифа появилась идея.",1],
 ["\"We will hold an archery contest,\" he said. \"The prize will be a golden arrow. Robin Hood will not be able to stay away.\"","«Мы устроим состязание лучников, — сказал он. — Приз — золотая стрела. Робин Гуд не сможет устоять»."],
 ["Robin's friends told him not to go. \"It is a trap!\" they said.","Друзья Робина отговаривали его. «Это ловушка!» — говорили они."],
 ["But Robin only laughed.","Но Робин только рассмеялся."],
 ["On the day of the contest, an old man in a brown coat joined the archers.","В день состязания к лучникам присоединился старик в коричневом плаще.",1],
 ["Nobody noticed him at first.","Сначала никто не обратил на него внимания."],
 ["One by one, the archers shot their arrows. The old man hit the very centre of the target.","Один за другим лучники выпускали стрелы. Старик попал в самый центр мишени."],
 ["Then he did something amazing: his second arrow split the first one in two!","А потом сделал невероятное: второй стрелой он расщепил первую надвое!"],
 ["The Sheriff gave him the golden arrow and looked carefully for Robin Hood in the crowd.","Шериф вручил ему золотую стрелу и внимательно искал Робина Гуда в толпе.",1],
 ["He did not see him anywhere.","Нигде его не было."],
 ["That evening, a letter arrived at the castle.","Тем вечером в замок пришло письмо."],
 ["\"Thank you for the golden arrow. — Robin Hood.\"","«Спасибо за золотую стрелу. — Робин Гуд»."]]},
{id:"en-dracula", lvl:3, emoji:"🦇", color:"#5a1e2b", title:"Dracula: Jonathan Harker's Journal", ru:"Дракула: дневник Джонатана Харкера", by:"по Брэму Стокеру, 1897 · адаптация B2", text:[
 ["3 May. I left Munich at 8:35 p.m. and arrived in Vienna early the next morning; the train was an hour late.","3 мая. Я выехал из Мюнхена в 20:35 и прибыл в Вену рано утром; поезд опоздал на час.",1],
 ["My employer had sent me, a young solicitor, to help a Transylvanian nobleman buy a house in London.","Мой работодатель отправил меня, молодого поверенного, помочь трансильванскому дворянину купить дом в Лондоне."],
 ["His name was Count Dracula, and his castle stood in the wildest part of the Carpathian Mountains.","Его звали граф Дракула, и его замок стоял в самой дикой части Карпатских гор."],
 ["The further east I travelled, the more uneasy the local people seemed.","Чем дальше на восток я ехал, тем тревожнее казались местные жители.",1],
 ["When I mentioned the Count's name at the inn, the landlady crossed herself and begged me not to go.","Когда я упомянул имя графа на постоялом дворе, хозяйка перекрестилась и умоляла меня не ехать."],
 ["Before I left, she hung a small crucifix around my neck, which I accepted only out of politeness.","Перед отъездом она повесила мне на шею маленькое распятие, которое я принял лишь из вежливости."],
 ["The coach climbed through dark pine forests as the sun went down.","Карета поднималась через тёмные сосновые леса, пока солнце садилось.",1],
 ["Somewhere in the distance, wolves began to howl, and the horses trembled with fear.","Где-то вдали завыли волки, и лошади задрожали от страха."],
 ["At midnight a strange driver with burning red eyes took me the rest of the way.","В полночь странный кучер с горящими красными глазами довёз меня до конца пути."],
 ["At last we stopped in the courtyard of a vast, ruined castle.","Наконец мы остановились во дворе огромного полуразрушенного замка.",1],
 ["The great door opened, and a tall old man, dressed entirely in black, stood before me holding a lamp.","Огромная дверь отворилась, и передо мной встал высокий старик, одетый во всё чёрное, с лампой в руке."],
 ["\"Welcome to my house,\" he said in excellent English. \"Enter freely and of your own will!\"","«Добро пожаловать в мой дом, — сказал он на прекрасном английском. — Входите свободно и по своей воле!»"],
 ["His hand was as cold as ice, and his grip was far stronger than I expected.","Его рука была холодна как лёд, а хватка гораздо сильнее, чем я ожидал."],
 ["Over the following days, I noticed details I could not explain.","В следующие дни я замечал подробности, которые не мог объяснить.",1],
 ["I never once saw the Count eat or drink, and he appeared only after sunset.","Я ни разу не видел, чтобы граф ел или пил, и появлялся он только после заката."],
 ["One morning, as I was shaving, he came up behind me — yet his reflection did not appear in the mirror.","Однажды утром, когда я брился, он подошёл сзади — но в зеркале его отражения не было."],
 ["Then I discovered that every door in the castle was locked. I was not a guest. I was a prisoner.","А потом я обнаружил, что все двери в замке заперты. Я был не гостем. Я был пленником.",1]]},
{id:"en-dorian", lvl:3, emoji:"🖼️", color:"#8a6d3b", title:"The Picture of Dorian Gray", ru:"Портрет Дориана Грея", by:"по Оскару Уайльду, 1890 · адаптация B2", text:[
 ["In a London studio filled with the scent of roses, the painter Basil Hallward was finishing a portrait.","В лондонской мастерской, наполненной ароматом роз, художник Бэзил Холлуорд заканчивал портрет.",1],
 ["It showed a young man of extraordinary beauty named Dorian Gray.","На нём был изображён юноша необыкновенной красоты по имени Дориан Грей."],
 ["Basil considered it the best work of his life, yet he refused to exhibit it.","Бэзил считал его лучшей работой своей жизни, однако отказывался его выставлять."],
 ["\"I have put too much of myself into it,\" he admitted.","«Я вложил в него слишком много себя», — признался он."],
 ["Basil's friend, Lord Henry, was a charming man with dangerous ideas.","Друг Бэзила, лорд Генри, был обаятельным человеком с опасными идеями.",1],
 ["\"Youth is the only thing worth having,\" he told Dorian. \"When it is gone, nothing will remain.\"","«Молодость — единственное, что стоит иметь, — сказал он Дориану. — Когда она уйдёт, ничего не останется»."],
 ["Dorian looked at the portrait and felt a sudden, terrible jealousy.","Дориан посмотрел на портрет и ощутил внезапную, страшную зависть."],
 ["\"If only it were the other way!\" he cried. \"If only I could stay young, and the picture could grow old!\"","«Если бы всё было наоборот! — воскликнул он. — Если бы я мог оставаться молодым, а стареть — портрет!»"],
 ["Without knowing it, he had made a wish that would be granted.","Сам того не зная, он загадал желание, которому суждено было исполниться.",1],
 ["Years passed, and Dorian lived a life of pleasure, never thinking of the consequences.","Шли годы, Дориан жил в удовольствиях, никогда не задумываясь о последствиях."],
 ["He broke the heart of a young actress, who could not bear the pain.","Он разбил сердце юной актрисы, которая не смогла вынести этой боли."],
 ["When he returned home that night, he noticed a cruel line around the mouth in the portrait.","Вернувшись домой той ночью, он заметил в портрете жестокую складку у рта."],
 ["His own face, however, remained perfectly innocent.","Его собственное лицо, однако, оставалось совершенно невинным."],
 ["Terrified, he hid the painting in a locked room at the top of the house.","В ужасе он спрятал картину в запертой комнате на верхнем этаже дома.",1],
 ["While society admired his eternal youth, the picture grew uglier with every sin he committed.","Пока общество восхищалось его вечной молодостью, портрет становился уродливее с каждым его грехом."],
 ["Eventually Dorian could no longer look at it without horror — for the face in the frame was the true face of his soul.","Со временем Дориан уже не мог смотреть на него без ужаса — ведь лицо в раме было истинным лицом его души."]]}
];

 ["乌龟赢了。","Wūguī yíng le.","Черепаха победила."],
 ["慢慢走，也能走到。","Mànmàn zǒu, yě néng zǒu dào.","Даже медленно можно дойти до цели.",1]]},
{id:"zh-szdt", lvl:1, emoji:"🌳", color:"#b7791f", title:"守株待兔", ru:"Ждать зайца у пня", by:"притча из «Хань Фэй-цзы» · пересказ HSK 1–2", text:[
 ["很久以前，有一个农民。","Hěn jiǔ yǐqián, yǒu yí ge nóngmín.","Давным-давно жил-был крестьянин.",1],
 ["他每天在地里工作，很累。","Tā měitiān zài dì li gōngzuò, hěn lèi.","Каждый день он работал в поле и очень уставал."],
 ["有一天，一只兔子跑得太快了。","Yǒu yì tiān, yì zhī tùzi pǎo de tài kuài le.","Однажды один заяц бежал слишком быстро.",1],
 ["它撞到了一棵树，死了。","Tā zhuàng dào le yì kē shù, sǐ le.","Он врезался в дерево и погиб."],
 ["农民很高兴：“不用工作，也有好吃的！”","Nóngmín hěn gāoxìng: “Bú yòng gōngzuò, yě yǒu hǎochī de!”","Крестьянин очень обрадовался: «И работать не надо, а вкусная еда есть!»"],
 ["从那天起，他不工作了。","Cóng nà tiān qǐ, tā bù gōngzuò le.","С того дня он перестал работать.",1],
 ["他每天坐在树旁边，等兔子。","Tā měitiān zuò zài shù pángbiān, děng tùzi.","Каждый день он сидел у дерева и ждал зайцев."],
 ["一天、两天、三天……","Yì tiān, liǎng tiān, sān tiān……","Один день, два дня, три дня…"],
 ["没有兔子来。","Méiyǒu tùzi lái.","Ни один заяц не пришёл."],
 ["他的地里都是草，没有吃的了。","Tā de dì li dōu shì cǎo, méiyǒu chī de le.","Его поле заросло травой, и еды не осталось.",1],
 ["人们都笑他。","Rénmen dōu xiào tā.","Все люди смеялись над ним."],
 ["不努力，只等好运气，是不行的。","Bù nǔlì, zhǐ děng hǎo yùnqi, shì bù xíng de.","Не стараться и только ждать удачи — так не годится."]]},
{id:"zh-bmzz", lvl:1, emoji:"🌱", color:"#3f7d3a", title:"拔苗助长", ru:"Тянуть ростки, чтобы росли быстрее", by:"притча из «Мэн-цзы» · пересказ HSK 1–2", text:[
 ["有一个人，他在地里种了很多禾苗。","Yǒu yí ge rén, tā zài dì li zhòng le hěn duō hémiáo.","Один человек посадил в поле много ростков риса.",1],
 ["他每天去看，可是禾苗长得很慢。","Tā měitiān qù kàn, kěshì hémiáo zhǎng de hěn màn.","Каждый день он ходил смотреть, но ростки росли очень медленно."],
 ["他很着急：“怎么办呢？”","Tā hěn zháojí: “Zěnme bàn ne?”","Он очень волновался: «Что же делать?»"],
 ["他想了一个办法。","Tā xiǎng le yí ge bànfǎ.","Он придумал способ.",1],
 ["他把每一棵苗都往上拉了一点儿。","Tā bǎ měi yì kē miáo dōu wǎng shàng lā le yìdiǎnr.","Он потянул каждый росток немного вверх."],
 ["他工作了一天，非常累。","Tā gōngzuò le yì tiān, fēicháng lèi.","Он проработал целый день и очень устал."],
 ["回到家，他对儿子说：","Huí dào jiā, tā duì érzi shuō:","Вернувшись домой, он сказал сыну:",1],
 ["“今天我很累，可是我帮禾苗长高了！”","“Jīntiān wǒ hěn lèi, kěshì wǒ bāng hémiáo zhǎng gāo le!”","«Сегодня я очень устал, но я помог росткам вырасти!»"],
 ["儿子马上跑去看。","Érzi mǎshàng pǎo qù kàn.","Сын сразу побежал посмотреть."],
 ["地里的苗都死了。","Dì li de miáo dōu sǐ le.","Все ростки в поле погибли.",1],
 ["做事情不能太着急。","Zuò shìqing bù néng tài zháojí.","В делах нельзя слишком торопиться."]]},
{id:"zh-hjhw", lvl:1, emoji:"🦊", color:"#c8372d", title:"狐假虎威", ru:"Лиса пользуется силой тигра", by:"притча из «Планов Сражающихся царств» · пересказ HSK 2", text:[
 ["一只老虎在森林里找吃的。","Yì zhī lǎohǔ zài sēnlín li zhǎo chī de.","Тигр искал в лесу еду.",1],
 ["他抓住了一只狐狸。","Tā zhuā zhù le yì zhī húli.","Он поймал лису."],
 ["狐狸很害怕，可是他想了一个办法。","Húli hěn hàipà, kěshì tā xiǎng le yí ge bànfǎ.","Лиса очень испугалась, но придумала хитрость."],
 ["狐狸说：“你不能吃我！我是森林的王。”","Húli shuō: “Nǐ bù néng chī wǒ! Wǒ shì sēnlín de wáng.”","Лиса сказала: «Ты не можешь меня съесть! Я царь леса»."],
 ["老虎不相信。","Lǎohǔ bù xiāngxìn.","Тигр не поверил.",1],
 ["狐狸说：“你跟我走，看看大家怕不怕我。”","Húli shuō: “Nǐ gēn wǒ zǒu, kànkan dàjiā pà bu pà wǒ.”","Лиса сказала: «Пойдём со мной и посмотрим, боятся ли меня все»."],
 ["狐狸走在前面，老虎走在后面。","Húli zǒu zài qiánmiàn, lǎohǔ zǒu zài hòumiàn.","Лиса шла впереди, тигр — позади.",1],
 ["小动物们看见了，都马上跑了。","Xiǎo dòngwùmen kànjiàn le, dōu mǎshàng pǎo le.","Маленькие звери увидели их и тут же разбежались."],
 ["老虎想：“它们真的怕狐狸！”","Lǎohǔ xiǎng: “Tāmen zhēn de pà húli!”","Тигр подумал: «Они правда боятся лису!»"],
 ["其实，它们怕的是老虎。","Qíshí, tāmen pà de shì lǎohǔ.","На самом деле они боялись тигра.",1],
 ["老虎不知道，就让狐狸走了。","Lǎohǔ bù zhīdào, jiù ràng húli zǒu le.","Тигр этого не понял и отпустил лису."]]},
{id:"zh-mhw", lvl:2, emoji:"🐒", color:"#d08a1c", title:"西游记：美猴王", ru:"Путешествие на Запад: Царь обезьян", by:"по роману У Чэнъэня, XVI век · пересказ HSK 3", text:[
 ["很久很久以前，在东方的大海里，有一座花果山。","Hěn jiǔ hěn jiǔ yǐqián, zài dōngfāng de dàhǎi li, yǒu yí zuò Huāguǒ Shān.","Давным-давно в восточном море была гора Цветов и Плодов.",1],
 ["山上有一块很大的石头。","Shān shang yǒu yí kuài hěn dà de shítou.","На горе лежал огромный камень."],
 ["有一天，石头突然开了，里面跳出来一只石猴。","Yǒu yì tiān, shítou tūrán kāi le, lǐmiàn tiào chūlái yì zhī shí hóu.","Однажды камень вдруг раскололся, и из него выпрыгнула каменная обезьяна."],
 ["石猴和别的猴子一起生活，每天吃水果、喝山水，非常快乐。","Shí hóu hé bié de hóuzi yìqǐ shēnghuó, měitiān chī shuǐguǒ, hē shān shuǐ, fēicháng kuàilè.","Каменная обезьяна жила вместе с другими обезьянами, ела фрукты, пила горную воду и была очень счастлива.",1],
 ["山上有一条大瀑布。","Shān shang yǒu yì tiáo dà pùbù.","На горе был большой водопад."],
 ["猴子们说：“谁敢进瀑布里面看看，我们就让他当大王！”","Hóuzimen shuō: “Shéi gǎn jìn pùbù lǐmiàn kànkan, wǒmen jiù ràng tā dāng dàwáng!”","Обезьяны сказали: «Кто осмелится зайти за водопад и посмотреть, того мы сделаем царём!»"],
 ["石猴一点儿也不怕，他跳进了瀑布。","Shí hóu yìdiǎnr yě bú pà, tā tiào jìn le pùbù.","Каменная обезьяна ничуть не испугалась и прыгнула в водопад.",1],
 ["瀑布后面有一个很大的山洞，里面有石床、石桌，还有石碗。","Pùbù hòumiàn yǒu yí ge hěn dà de shāndòng, lǐmiàn yǒu shí chuáng, shí zhuō, hái yǒu shí wǎn.","За водопадом была огромная пещера, а в ней каменные кровати, каменные столы и даже каменные миски."],
 ["他跳出来，大声说：“里面没有水，是一个好地方！我们都可以住在那儿！”","Tā tiào chūlái, dàshēng shuō: “Lǐmiàn méiyǒu shuǐ, shì yí ge hǎo dìfang! Wǒmen dōu kěyǐ zhù zài nàr!”","Он выпрыгнул и громко сказал: «Там нет воды, это хорошее место! Мы все можем там жить!»"],
 ["猴子们都非常高兴，跟着他进了山洞。","Hóuzimen dōu fēicháng gāoxìng, gēnzhe tā jìn le shāndòng.","Все обезьяны очень обрадовались и пошли за ним в пещеру.",1],
 ["从那天起，石猴成了猴子们的大王。","Cóng nà tiān qǐ, shí hóu chéng le hóuzimen de dàwáng.","С того дня каменная обезьяна стала царём обезьян."],
 ["大家叫他“美猴王”。","Dàjiā jiào tā “Měi Hóuwáng”.","Все называли его «Прекрасный царь обезьян»."],
 ["可是，美猴王有一个问题：他不想变老，也不想死。","Kěshì, Měi Hóuwáng yǒu yí ge wèntí: tā bù xiǎng biàn lǎo, yě bù xiǎng sǐ.","Но у Прекрасного царя обезьян была одна забота: он не хотел стареть и не хотел умирать.",1],
 ["所以，他决定离开花果山，去找能教他本领的老师。","Suǒyǐ, tā juédìng líkāi Huāguǒ Shān, qù zhǎo néng jiāo tā běnlǐng de lǎoshī.","Поэтому он решил покинуть гору Цветов и Плодов и отправиться искать учителя, который научит его волшебству."]]},
{id:"zh-mulan", lvl:2, emoji:"🗡️", color:"#a23b5c", title:"花木兰", ru:"Мулань", by:"по «Балладе о Мулань», VI век · пересказ HSK 3", text:[
 ["花木兰是一个普通的女孩子，她住在北方的一个小村子里。","Huā Mùlán shì yí ge pǔtōng de nǚháizi, tā zhù zài běifāng de yí ge xiǎo cūnzi li.","Хуа Мулань была обычной девушкой и жила в маленькой деревне на севере.",1],
 ["她每天在家里织布，帮助爸爸妈妈。","Tā měitiān zài jiā li zhī bù, bāngzhù bàba māma.","Каждый день она ткала дома и помогала родителям."],
 ["有一天，皇帝要很多男人去打仗。","Yǒu yì tiān, huángdì yào hěn duō nánrén qù dǎzhàng.","Однажды император призвал множество мужчин на войну.",1],
 ["名单上有木兰爸爸的名字。","Míngdān shang yǒu Mùlán bàba de míngzi.","В списке было имя отца Мулань."],
 ["可是爸爸已经老了，身体也不好，弟弟又太小。","Kěshì bàba yǐjīng lǎo le, shēntǐ yě bù hǎo, dìdi yòu tài xiǎo.","Но отец был уже стар и нездоров, а младший брат слишком мал."],
 ["木兰很担心，她想了很久，最后做了一个决定。","Mùlán hěn dānxīn, tā xiǎng le hěn jiǔ, zuìhòu zuò le yí ge juédìng.","Мулань очень переживала, долго думала и наконец приняла решение.",1],
 ["她买了马，穿上男人的衣服，代替爸爸去打仗。","Tā mǎi le mǎ, chuān shang nánrén de yīfu, dàitì bàba qù dǎzhàng.","Она купила коня, надела мужскую одежду и пошла воевать вместо отца."],
 ["木兰在军队里待了十二年。","Mùlán zài jūnduì li dāi le shí'èr nián.","Мулань провела в армии двенадцать лет.",1],
 ["她非常勇敢，打了很多胜仗。","Tā fēicháng yǒnggǎn, dǎ le hěn duō shèngzhàng.","Она была очень храброй и одержала много побед."],
 ["没有人知道她是女孩子。","Méiyǒu rén zhīdào tā shì nǚháizi.","Никто не знал, что она девушка."],
 ["战争结束以后，皇帝想给她很高的官和很多钱。","Zhànzhēng jiéshù yǐhòu, huángdì xiǎng gěi tā hěn gāo de guān hé hěn duō qián.","Когда война закончилась, император хотел дать ей высокую должность и много денег.",1],
 ["木兰说：“我什么都不要，我只想回家。”","Mùlán shuō: “Wǒ shénme dōu bú yào, wǒ zhǐ xiǎng huí jiā.”","Мулань сказала: «Мне ничего не нужно, я только хочу домой»."],
 ["回到家里，她换上了漂亮的衣服。","Huí dào jiā li, tā huàn shang le piàoliang de yīfu.","Вернувшись домой, она переоделась в красивое платье.",1],
 ["她的朋友们都非常吃惊：“我们一起打了十二年仗，不知道你是女孩子！”","Tā de péngyoumen dōu fēicháng chījīng: “Wǒmen yìqǐ dǎ le shí'èr nián zhàng, bù zhīdào nǐ shì nǚháizi!”","Её боевые товарищи были потрясены: «Мы двенадцать лет воевали вместе и не знали, что ты девушка!»"]]},
{id:"zh-ygys", lvl:2, emoji:"⛰️", color:"#5b6b3a", title:"愚公移山", ru:"Старик Юй-гун двигает горы", by:"притча из «Ле-цзы» · пересказ HSK 3", text:[
 ["很久以前，有一个老人叫愚公，他已经九十岁了。","Hěn jiǔ yǐqián, yǒu yí ge lǎorén jiào Yúgōng, tā yǐjīng jiǔshí suì le.","Давным-давно жил старик по имени Юй-гун, ему было уже девяносто лет.",1],
 ["他家门前有两座大山，出门非常不方便。","Tā jiā mén qián yǒu liǎng zuò dà shān, chūmén fēicháng bù fāngbiàn.","Перед его домом стояли две большие горы, и выходить из дома было очень неудобно."],
 ["有一天，愚公对家人说：“我们一起把山搬走吧！”","Yǒu yì tiān, Yúgōng duì jiārén shuō: “Wǒmen yìqǐ bǎ shān bān zǒu ba!”","Однажды Юй-гун сказал семье: «Давайте вместе уберём горы!»",1],
 ["家人都同意了。","Jiārén dōu tóngyì le.","Вся семья согласилась."],
 ["他们每天挖山，把石头和土送到很远的大海里。","Tāmen měitiān wā shān, bǎ shítou hé tǔ sòng dào hěn yuǎn de dàhǎi li.","Каждый день они копали гору и относили камни и землю к далёкому морю."],
 ["一个聪明的老人笑他：“你这么老了，怎么能搬走这么大的山？”","Yí ge cōngming de lǎorén xiào tā: “Nǐ zhème lǎo le, zěnme néng bān zǒu zhème dà de shān?”","Один «умный» старик посмеялся над ним: «Ты такой старый, как ты сдвинешь такие большие горы?»",1],
 ["愚公回答：“我死了，还有儿子；儿子死了，还有孙子。”","Yúgōng huídá: “Wǒ sǐ le, hái yǒu érzi; érzi sǐ le, hái yǒu sūnzi.”","Юй-гун ответил: «Умру я — останется сын; умрёт сын — останется внук»."],
 ["“我们的孩子越来越多，可是山不会长高。为什么搬不走呢？”","“Wǒmen de háizi yuè lái yuè duō, kěshì shān bú huì zhǎng gāo. Wèishénme bān bu zǒu ne?”","«Наших детей становится всё больше, а гора выше не станет. Почему же её не убрать?»"],
 ["聪明的老人不知道说什么好。","Cōngming de lǎorén bù zhīdào shuō shénme hǎo.","«Умный» старик не нашёлся, что ответить.",1],
 ["天上的神听说了这件事，被愚公感动了。","Tiān shang de shén tīngshuō le zhè jiàn shì, bèi Yúgōng gǎndòng le.","Небесный бог услышал об этом и был тронут упорством Юй-гуна."],
 ["他派人把两座山搬走了。","Tā pài rén bǎ liǎng zuò shān bān zǒu le.","Он послал помощников, и они унесли обе горы."],
 ["只要坚持，没有做不到的事。","Zhǐyào jiānchí, méiyǒu zuò bu dào de shì.","Если упорно трудиться, нет ничего невозможного.",1]]},
{id:"zh-smg", lvl:2, emoji:"🏺", color:"#1f6f8b", title:"司马光砸缸", ru:"Сыма Гуан разбивает чан", by:"история о Сыма Гуане, XI век · пересказ HSK 3", text:[
 ["司马光是宋朝一个有名的人。","Sīmǎ Guāng shì Sòngcháo yí ge yǒumíng de rén.","Сыма Гуан — знаменитый человек эпохи Сун.",1],
 ["他小时候就非常聪明。","Tā xiǎoshíhou jiù fēicháng cōngming.","Уже в детстве он был очень умным."],
 ["有一天，司马光和几个小朋友在花园里玩儿。","Yǒu yì tiān, Sīmǎ Guāng hé jǐ ge xiǎopéngyǒu zài huāyuán li wánr.","Однажды Сыма Гуан с несколькими друзьями играл в саду.",1],
 ["花园里有一个很大的水缸，里面都是水。","Huāyuán li yǒu yí ge hěn dà de shuǐgāng, lǐmiàn dōu shì shuǐ.","В саду стоял огромный чан, полный воды."],
 ["一个孩子爬到水缸上面，不小心掉进去了。","Yí ge háizi pá dào shuǐgāng shàngmiàn, bù xiǎoxīn diào jìnqù le.","Один мальчик залез на чан и случайно упал в воду."],
 ["别的孩子都吓坏了，有的哭，有的大声叫，有的跑去找大人。","Bié de háizi dōu xià huài le, yǒu de kū, yǒu de dàshēng jiào, yǒu de pǎo qù zhǎo dàren.","Остальные дети страшно испугались: кто-то плакал, кто-то громко кричал, кто-то побежал за взрослыми.",1],
 ["水缸太高了，大家都拉不出来他。","Shuǐgāng tài gāo le, dàjiā dōu lā bu chūlái tā.","Чан был слишком высоким, и никто не мог его вытащить."],
 ["司马光没有哭，他马上想了一个办法。","Sīmǎ Guāng méiyǒu kū, tā mǎshàng xiǎng le yí ge bànfǎ.","Сыма Гуан не плакал — он сразу придумал, что делать.",1],
 ["他拿起一块大石头，用力砸水缸。","Tā ná qǐ yí kuài dà shítou, yònglì zá shuǐgāng.","Он поднял большой камень и изо всех сил ударил по чану."],
 ["“砰”的一声，水缸破了，水都流了出来。","“Pēng” de yì shēng, shuǐgāng pò le, shuǐ dōu liú le chūlái.","«Бах!» — чан раскололся, и вся вода вытекла."],
 ["掉进水缸的孩子得救了。","Diào jìn shuǐgāng de háizi déjiù le.","Мальчик, упавший в чан, был спасён."],
 ["大人们都说：“这个孩子遇到危险不着急，真了不起！”","Dàrenmen dōu shuō: “Zhège háizi yù dào wēixiǎn bù zháojí, zhēn liǎobuqǐ!”","Взрослые говорили: «Этот ребёнок не растерялся в опасности — просто молодец!»",1]]},
{id:"zh-ccjj", lvl:3, emoji:"🏹", color:"#3b4a63", title:"三国演义：草船借箭", ru:"Троецарствие: Соломенные лодки «одалживают» стрелы", by:"по роману Ло Гуаньчжуна, XIV век · пересказ HSK 4", text:[
 ["三国时期，曹操率领大军南下，准备攻打东吴。","Sānguó shíqī, Cáo Cāo shuàilǐng dàjūn nánxià, zhǔnbèi gōngdǎ Dōngwú.","В эпоху Троецарствия Цао Цао повёл огромную армию на юг, готовясь напасть на царство У.",1],
 ["东吴的大都督周瑜和刘备的军师诸葛亮决定联合抗曹。","Dōngwú de dà dūdu Zhōu Yú hé Liú Bèi de jūnshī Zhūgě Liàng juédìng liánhé kàng Cáo.","Главнокомандующий У Чжоу Юй и советник Лю Бэя Чжугэ Лян решили вместе противостоять Цао Цао."],
 ["可是周瑜非常嫉妒诸葛亮的才能，总想找机会为难他。","Kěshì Zhōu Yú fēicháng jídù Zhūgě Liàng de cáinéng, zǒng xiǎng zhǎo jīhuì wéinán tā.","Но Чжоу Юй сильно завидовал таланту Чжугэ Ляна и всё искал случая поставить его в трудное положение."],
 ["有一天，周瑜要求诸葛亮在十天之内造好十万支箭。","Yǒu yì tiān, Zhōu Yú yāoqiú Zhūgě Liàng zài shí tiān zhī nèi zào hǎo shíwàn zhī jiàn.","Однажды Чжоу Юй потребовал, чтобы Чжугэ Лян за десять дней изготовил сто тысяч стрел.",1],
 ["没想到，诸葛亮却说：“只要三天就够了。”","Méi xiǎngdào, Zhūgě Liàng què shuō: “Zhǐ yào sān tiān jiù gòu le.”","Неожиданно Чжугэ Лян ответил: «Хватит и трёх дней»."],
 ["他还立下了军令状：如果完不成任务，愿意接受惩罚。","Tā hái lìxià le jūnlìngzhuàng: rúguǒ wán bu chéng rènwu, yuànyì jiēshòu chéngfá.","Он даже дал письменную клятву: если не выполнит задание, готов понести наказание."],
 ["前两天，诸葛亮什么也没做，大家都替他担心。","Qián liǎng tiān, Zhūgě Liàng shénme yě méi zuò, dàjiā dōu tì tā dānxīn.","Первые два дня Чжугэ Лян ничего не делал, и все за него волновались.",1],
 ["他只是悄悄地准备了二十条小船，每条船上都放满了草人。","Tā zhǐshì qiāoqiāo de zhǔnbèi le èrshí tiáo xiǎo chuán, měi tiáo chuán shang dōu fàng mǎn le cǎorén.","Он лишь тайком подготовил двадцать лодок и на каждую поставил множество соломенных чучел."],
 ["第三天凌晨，江上起了大雾，什么都看不清楚。","Dì-sān tiān língchén, jiāng shang qǐ le dà wù, shénme dōu kàn bu qīngchu.","На рассвете третьего дня над рекой поднялся густой туман, и ничего не было видно.",1],
 ["诸葛亮让士兵把船开向曹军，一边前进，一边敲鼓呐喊。","Zhūgě Liàng ràng shìbīng bǎ chuán kāi xiàng Cáo jūn, yìbiān qiánjìn, yìbiān qiāo gǔ nàhǎn.","Чжугэ Лян велел солдатам плыть к армии Цао Цао, бить в барабаны и громко кричать."],
 ["曹操以为敌人来攻击，又怕雾里有埋伏，就命令弓箭手一齐放箭。","Cáo Cāo yǐwéi dírén lái gōngjī, yòu pà wù li yǒu máifu, jiù mìnglìng gōngjiànshǒu yìqí fàng jiàn.","Цао Цао решил, что враг нападает, и, опасаясь засады в тумане, приказал лучникам стрелять залпом."],
 ["成千上万支箭射过来，都扎在了草人身上。","Chéng qiān shàng wàn zhī jiàn shè guòlái, dōu zhā zài le cǎorén shēnshang.","Десятки тысяч стрел полетели в лодки и воткнулись в соломенные чучела.",1],
 ["太阳出来的时候，雾散了，船上已经插满了箭。","Tàiyáng chūlái de shíhou, wù sàn le, chuán shang yǐjīng chā mǎn le jiàn.","Когда взошло солнце и туман рассеялся, лодки уже были утыканы стрелами."],
 ["诸葛亮让士兵们大喊：“谢谢曹丞相的箭！”然后迅速回到了东吴。","Zhūgě Liàng ràng shìbīngmen dà hǎn: “Xièxie Cáo chéngxiàng de jiàn!” Ránhòu xùnsù huí dào le Dōngwú.","Чжугэ Лян велел солдатам прокричать: «Спасибо канцлеру Цао за стрелы!» — и быстро вернулся в У."],
 ["一数，正好十万多支。","Yì shǔ, zhènghǎo shíwàn duō zhī.","Пересчитали — вышло как раз больше ста тысяч.",1],
 ["周瑜听说以后，长叹一声：“诸葛亮真是神机妙算，我比不上他啊！”","Zhōu Yú tīngshuō yǐhòu, cháng tàn yì shēng: “Zhūgě Liàng zhēn shì shénjī-miàosuàn, wǒ bǐ bu shàng tā a!”","Услышав об этом, Чжоу Юй тяжело вздохнул: «Чжугэ Лян — настоящий гений хитрости, мне с ним не сравниться!»"]]},
{id:"zh-bsz", lvl:3, emoji:"🐍", color:"#2c7a6b", title:"白蛇传", ru:"Легенда о Белой змее", by:"китайская легенда · пересказ HSK 4", text:[
 ["传说很久以前，峨眉山上住着一条修炼了一千年的白蛇。","Chuánshuō hěn jiǔ yǐqián, Éméi Shān shang zhùzhe yì tiáo xiūliàn le yìqiān nián de bái shé.","Говорят, давным-давно на горе Эмэй жила Белая змея, которая тысячу лет совершенствовалась в магии.",1],
 ["她变成了一位美丽的姑娘，名叫白素贞，和好姐妹小青一起来到了杭州。","Tā biànchéng le yí wèi měilì de gūniang, míng jiào Bái Sùzhēn, hé hǎo jiěmèi Xiǎoqīng yìqǐ lái dào le Hángzhōu.","Она превратилась в прекрасную девушку по имени Бай Сучжэнь и вместе с верной подругой Сяоцин пришла в Ханчжоу."],
 ["那天是清明节，西湖边下起了小雨。","Nà tiān shì Qīngmíng Jié, Xīhú biān xià qǐ le xiǎoyǔ.","Был праздник Цинмин, и у озера Сиху пошёл мелкий дождь.",1],
 ["一个叫许仙的年轻人把自己的伞借给了她们。","Yí ge jiào Xǔ Xiān de niánqīngrén bǎ zìjǐ de sǎn jiè gěi le tāmen.","Юноша по имени Сюй Сянь одолжил им свой зонт."],
 ["白素贞被他的善良打动了，不久两个人就结了婚。","Bái Sùzhēn bèi tā de shànliáng dǎdòng le, bùjiǔ liǎng ge rén jiù jié le hūn.","Бай Сучжэнь была тронута его добротой, и вскоре они поженились."],
 ["他们开了一家药店，白素贞常常免费给穷人看病，大家都很尊敬她。","Tāmen kāi le yì jiā yàodiàn, Bái Sùzhēn chángcháng miǎnfèi gěi qióngrén kànbìng, dàjiā dōu hěn zūnjìng tā.","Они открыли аптеку; Бай Сучжэнь часто бесплатно лечила бедняков, и все её уважали.",1],
 ["然而，金山寺的和尚法海发现了她的秘密。","Rán'ér, Jīnshān Sì de héshang Fǎhǎi fāxiàn le tā de mìmì.","Однако монах Фахай из монастыря Цзиньшань раскрыл её тайну.",1],
 ["他认为人和妖不能在一起，就劝许仙在端午节让妻子喝雄黄酒。","Tā rènwéi rén hé yāo bù néng zài yìqǐ, jiù quàn Xǔ Xiān zài Duānwǔ Jié ràng qīzi hē xiónghuáng jiǔ.","Считая, что человек и дух не могут быть вместе, он уговорил Сюй Сяня на праздник Дуаньу угостить жену вином с реальгаром."],
 ["白素贞喝了酒以后，现出了白蛇的原形，许仙当场被吓死了。","Bái Sùzhēn hē le jiǔ yǐhòu, xiàn chū le bái shé de yuánxíng, Xǔ Xiān dāngchǎng bèi xià sǐ le.","Выпив вино, Бай Сучжэнь приняла облик белой змеи, и Сюй Сянь тут же умер от страха."],
 ["为了救丈夫，白素贞不顾危险，飞到昆仑山偷来了仙草，终于把他救活了。","Wèile jiù zhàngfu, Bái Sùzhēn búgù wēixiǎn, fēi dào Kūnlún Shān tōu lái le xiāncǎo, zhōngyú bǎ tā jiù huó le.","Чтобы спасти мужа, Бай Сучжэнь, невзирая на опасность, полетела на гору Куньлунь, похитила волшебную траву и вернула его к жизни.",1],
 ["后来，法海把许仙关在金山寺里。","Hòulái, Fǎhǎi bǎ Xǔ Xiān guān zài Jīnshān Sì li.","Позже Фахай заточил Сюй Сяня в монастыре Цзиньшань."],
 ["白素贞和小青用法术让大水淹没了金山寺，可是她最终还是被法海压在了雷峰塔下。","Bái Sùzhēn hé Xiǎoqīng yòng fǎshù ràng dàshuǐ yānmò le Jīnshān Sì, kěshì tā zuìzhōng háishi bèi Fǎhǎi yā zài le Léifēng Tǎ xià.","Бай Сучжэнь и Сяоцин магией затопили монастырь, но в конце концов Фахай заточил Белую змею под пагодой Лэйфэн."],
 ["很多年以后，小青练成了强大的法术，打败了法海，救出了白素贞。","Hěn duō nián yǐhòu, Xiǎoqīng liàn chéng le qiángdà de fǎshù, dǎbài le Fǎhǎi, jiù chū le Bái Sùzhēn.","Много лет спустя Сяоцин овладела могущественной магией, победила Фахая и освободила Бай Сучжэнь.",1],
 ["直到今天，人们来到西湖边，还会讲起这个关于爱情和勇气的故事。","Zhídào jīntiān, rénmen lái dào Xīhú biān, hái huì jiǎng qǐ zhège guānyú àiqíng hé yǒngqì de gùshi.","И по сей день люди, приходя к озеру Сиху, рассказывают эту историю о любви и смелости."]]}

const CHUNK = 50;
let GROUPS = {zh:{}, en:{}};
function buildWords(){
  const out = {zh:{}, en:{}}, groups = {zh:{}, en:{}};
  const add = (l, deck, group, list)=>{ out[l][deck]=list; (groups[l][group]=groups[l][group]||[]).push(deck); };
  for (const [deck, arr] of Object.entries(ZH)) add("zh", deck, "Темы", arr.map(a=>({id:"zh:"+a[0], w:a[0], t:a[1], m:a[2], ex:a[3], exT:a[4], exM:a[5], deck, group:"Темы"})));
  for (const [deck, arr] of Object.entries(EN)) add("en", deck, "Темы", arr.map(a=>({id:"en:"+a[0], w:a[0], t:a[1], m:a[2], ex:a[3], exM:a[4], deck, group:"Темы"})));
  for (const l of ["zh","en"]) for (const [grp, arr] of Object.entries(BIG[l])) for (let i=0;i<arr.length;i+=CHUNK){
    const deck = `${grp} · ${i/CHUNK+1}`;
    add(l, deck, grp, arr.slice(i,i+CHUNK).map(a=>({id:l+":"+a[0], w:a[0], t:a[1], m:a[2], tn:a[3]||"", ex:"", exT:"", exM:"", deck, group:grp})));
  }
  for (const l of ["zh","en"]) for (const [deck, arr] of Object.entries((S.custom&&S.custom[l])||{}))
    add(l, deck, "✨ Мои темы", arr.map(a=> l==="zh" ? {id:"zh:"+a[0], w:a[0], t:a[1], m:a[2], ex:a[3], exT:a[4], exM:a[5], deck, custom:true, group:"✨ Мои темы"} : {id:"en:"+a[0], w:a[0], t:a[1], m:a[2], ex:a[3], exM:a[4], deck, custom:true, group:"✨ Мои темы"}));
  GROUPS = groups; return out;
}
let WORDS = {zh:{},en:{}}, ALL = {zh:[],en:[]};
function rebuildWords(){
  WORDS = buildWords();
  for(const l of ["zh","en"]){
    const seen = new Set(); ALL[l] = [];
    for(const arr of Object.values(WORDS[l])) for(const w of arr) if(!seen.has(w.id)){ seen.add(w.id); ALL[l].push(w); }
    if(S.deck[l] && !WORDS[l][S.deck[l]]) S.deck[l]=null;
    if(S.dgroup && S.dgroup[l] && !GROUPS[l][S.dgroup[l]]) S.dgroup[l]="Темы";
  }
}

function card(id){ return S.cards[id] || null; }
function grade(id, q){ // q: 0 снова, 1 трудно, 2 хорошо, 3 легко
  const c = S.cards[id] || {ef:2.5, iv:0, reps:0, due:0, seen:0, right:0};
  c.seen++; if(q>=2) c.right++;
  if(q===0){ c.reps=0; c.iv=0; c.due=Date.now()+60*1000; }
  else {
    c.reps++;
    if(c.reps===1) c.iv = q===3?3:1;
    else if(c.reps===2) c.iv = q===3?7:(q===1?2:4);
    else c.iv = Math.max(1, Math.round(c.iv * (q===1?1.2:(q===3?c.ef*1.3:c.ef))));
    c.ef = Math.max(1.3, c.ef + (q===3?0.15:q===1?-0.15:0));
    c.due = today() + c.iv*DAY;
  }
  S.cards[id]=c;
  markDay();
  save();
}
function markDay(){ const t=today(); if(!S.days.includes(t)){ S.days.push(t); S.days=S.days.slice(-400);} }
function streak(){
  const set=new Set(S.days); let d=today(), n=0;
  if(!set.has(d)) d-=DAY;
  while(set.has(d)){ n++; d-=DAY; }

}

function langVoices(l){
  try{ return speechSynthesis.getVoices().filter(v=>{ const x=(v.lang||"").replace("_","-").toLowerCase();
    return l==="zh" ? (x.startsWith("zh") || x.startsWith("cmn")) && !/hk|yue/.test(x) : x.startsWith(l); }); }catch(e){ return []; }
}
function voiceScore(v, l){
  const n=v.name, x=(v.lang||"").replace("_","-").toLowerCase(); let s=0;
  if(/natural|neural/i.test(n)) s+=60;
  if(/online/i.test(n)) s+=20;
  if(/premium|enhanced|siri/i.test(n)) s+=45;
  if(/google/i.test(n)) s+=35;
  if(/compact|espeak|robot/i.test(n)) s-=40;
  if(l==="zh"){ if(x==="zh-cn"||x.startsWith("cmn")) s+=15; if(/tw/.test(x)) s-=5; if(/xiaoxiao|xiaoyi|yunxi|tingting|tian/i.test(n)) s+=10; }
  else { if(x==="en-gb") s+=15; else if(x==="en-us") s+=10; if(/sonia|libby|ryan|aria|jenny|daniel|serena/i.test(n)) s+=10; }
  if(v.localService===false) s+=5;
  return s;
}
function bestVoice(l){
  const vs = langVoices(l); if(!vs.length) return null;
  const pref = S.voice.browser[l]; if(pref){ const v=vs.find(v=>v.name===pref); if(v) return v; }
  return vs.slice().sort((a,b)=>voiceScore(b,l)-voiceScore(a,l))[0];
}
const LCODE = {zh:"zh-CN", en:"en-GB", ru:"ru-RU"};
function browserSpeak(text, rate, btn, seq, lang){
  return new Promise(res=>{
    try{
      if(!("speechSynthesis" in window)) return res();
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = bestVoice(lang); u.lang = LCODE[lang]; if(v){ u.voice=v; u.lang=v.lang; }
      u.rate = Math.max(0.5, rate*(lang==="zh"?0.92:1)); u.pitch = 1;
      u.onstart = ()=>{ if(seq===speakSeq) setPlaying(btn); };
      u.onend = u.onerror = ()=>{ if(seq===speakSeq) stopPlaying(); res(); };
      speechSynthesis.speak(u);
    }catch(e){ res(); }
  });
}
/* speakQuiet(text, {slow, btn, lang, voice, rate}) — возвращает промис, который завершается после озвучки */
async function speak(text, opts={}){
  text = String(text||"").trim(); if(!text) return;
  const seq = ++speakSeq, btn = opts.btn||null, lang = opts.lang||S.lang;
  const rate = opts.rate || (opts.slow ? 0.7 : S.voice.rate);
  const useClaude = ttsCap && S.voice.engine!=="browser";
  try{ speechSynthesis.cancel(); }catch(e){}
  if(useClaude){
    setPlaying(btn);
    try{
      await ttsCap.speak(text.slice(0,2000), {voice:opts.voice||S.voice.claude, rate:Math.min(1.5,Math.max(0.7,rate)), language:LCODE[lang]});
      if(seq===speakSeq) stopPlaying();
      return;
    }catch(e){
      const code = e && e.code, started = claudeStartedSeq===seq;
      if(code==="not_granted"){ ttsCap=null; }
      if(seq!==speakSeq) throw {code:"interrupted"};
      if(code==="viewer_stopped" || (started && code!=="not_granted")) { stopPlaying(); throw {code:"stopped"}; }
    }
  }
  await browserSpeak(text, rate, btn, seq, lang);
  if(seq!==speakSeq) throw {code:"interrupted"};
}
function speakQuiet(text, opts){ speak(text, opts).catch(()=>{}); }
function stopSpeaking(){ speakSeq++; try{ ttsCap && ttsCap.stop && ttsCap.stop(); }catch(e){} try{ speechSynthesis.cancel(); }catch(e){} stopPlaying(); }

async function aiMakeDeck(topic){

    ? `Составь учебную тему из 10 полезных китайских слов на тему «${topic}» для русскоязычного ученика (${LEVEL.zh}). Слова частотные, простые. Верни JSON-массив из 10 объектов: {"w":"иероглифы","t":"пиньинь с тоновыми знаками","m":"перевод на русский (кратко)","ex":"простое предложение-пример иероглифами","exT":"пиньинь примера с тонами","exM":"перевод примера на русский"}. Без повторов слов: ${knownWords()}.`

  try{

    if(arr && !Array.isArray(arr)) arr = Object.values(arr).find(Array.isArray) || [];
    const have = new Set(allOf(S.lang).map(w=>w.w));
    const rows = (arr||[]).filter(o=>o&&o.w&&o.t&&o.m&&o.ex&&o.exM && !have.has(String(o.w))).slice(0,15)

  render();
}

async function playFrom(from, only){
  const a=ui.audio, it=findItem(a.item); if(!it) return;
  stopSpeaking(); const token=++a.token; a.playing=true; markLine(); markDay(); save();
  for(let i=from;i<it.lines.length;i++){
    if(token!==a.token) return;
    a.cur=i; markLine();

    await sleep(it.kind==="dialog"?450:250);

  }

}

function handsFree(){

async function handsFreeAt(list, start){
  const token = ++ui.audio.token;
  ui.hf = {on:true, list, i:start, show:false, phase:"", token};
  const alive = ()=> ui.hf && ui.hf.on && ui.hf.token===token;
  const step = async(fn)=>{ if(!alive()) throw 0; await fn(); if(!alive()) throw 0; };
  const show = (on, phase)=>{ ui.hf.show=on; ui.hf.phase=phase||""; if(S.tab==="audio") render(); };
  markDay(); save();
  try{
    while(alive() && ui.hf.i < ui.hf.list.length){
      const i = ui.hf.i, w = ui.hf.list[i];
      if(S.hfDir==="rev"){
        show(false,"Вспомни слово"); await step(()=>speak(w.m,{lang:"ru"}));
        await step(()=>sleep(2600));
        show(true,"Ответ"); await step(()=>speak(w.w)); await step(()=>sleep(700)); await step(()=>speak(w.w,{slow:true}));
      } else {
        show(false,"Вспомни перевод"); await step(()=>speak(w.w));
        await step(()=>sleep(2400));
        show(true,"Ответ"); await step(()=>speak(w.m,{lang:"ru"})); await step(()=>sleep(500)); await step(()=>speak(w.w));
        if(w.ex && S.lang==="en"){ await step(()=>sleep(400)); await step(()=>speak(w.ex)); }
      }
      const c=S.cards[w.id]; if(c){ c.seen++; }
      await step(()=>sleep(1300));
      if(ui.hf.i===i) ui.hf.i++;
    }
  }catch(e){ return; }
  if(alive()){ ui.hf.on=false; save(); ui.hfDone=true; if(S.tab==="audio") render(); }
}

/* --- тренажёр тонов --- */
const TONE_MARK = {"1":"ˉ","2":"ˊ","3":"ˇ","4":"ˋ","5":"·"};
const TONE_NAME = {"1":"1-й (ровный)","2":"2-й (восходящий)","3":"3-й (нисходяще-восходящий)","4":"4-й (нисходящий)","5":"лёгкий"};
function tonePool(){
  const lvl = S.toneLvl||"HSK 1";
  return allOf("zh").filter(w=>w.tn && w.tn.length<=2 && !/[一不]/.test(w.w) && w.tn!=="33" && !/^5/.test(w.tn) && (lvl==="all"||w.group===lvl||(lvl==="HSK 1"&&w.group==="Темы")));
}
function newToneQ(){ const p=tonePool(); const w=p[Math.floor(Math.random()*p.length)]; ui.tone={w, pick:[], done:false}; }
function renderTones(){
  if(!ui.tone || !ui.tone.w) newToneQ();
  const q=ui.tone, w=q.w; if(!w) return `<div class="panel">Нет слов для тренировки.</div>`;
  const st=S.tones; const pct = st.n? Math.round(st.ok/st.n*100):0;
  const conf = Object.entries(st.conf||{}).sort((a,b)=>b[1]-a[1])[0];
  const syl = w.tn.split("");
  const rows = syl.map((t,si)=>`<div class="trow"><span class="hint">${syl.length>1?`Слог ${si+1}:`:"Тон:"}</span>${["1","2","3","4"].concat(si>0?["5"]:[]).map(k=>{
      let c=""; if(q.done){ if(k===t) c="right"; else if(q.pick[si]===k) c="wrong"; } else if(q.pick[si]===k) c="on";
      return `<button class="tbtn ${c}" data-tone="${si}:${k}" ${q.done?"disabled":""}><b>${TONE_MARK[k]}</b><small>${k==="5"?"лёгкий":k}</small></button>`; }).join("")}</div>`).join("");
  return `<div class="chips">${[["HSK 1","HSK 1"],["HSK 2","HSK 2"],["HSK 3","HSK 3"],["all","Все"]].map(([k,n])=>`<button class="chip ${ (S.toneLvl||"HSK 1")===k?"on":""}" data-tonelvl="${k}">${n}</button>`).join("")}</div>
  <div class="panel center">
    <div class="progress"><span>Точность: ${st.n?pct+"% из "+st.n:"—"}</span><span>${conf?`Чаще путаешь: ${conf[0].replace(">"," → ")}`:""}</span></div>
    <div class="flash" style="min-height:150px">
      ${q.done?`<div class="big">${esc(w.w)}</div><div class="sub">${esc(w.t)}</div><div class="mean">${esc(w.m)}</div>`
        :`<button class="btn" data-tsay style="font-size:20px;padding:16px 26px">▶ Слушать</button><div class="hint">Какие тоны ты слышишь? ${syl.length} ${syl.length>1?"слога":"слог"}</div>`}
    </div>
    <div class="row" style="justify-content:center">${speakBtn(w.w)}</div>
    ${rows}
    ${q.done?`<p style="font-size:17px;margin:12px 0 4px">${q.ok?"✅ Верно!":"❌ Правильно: "+syl.map(t=>TONE_NAME[t]).join(" + ")}</p><button class="btn" data-tnext>Дальше →</button>`:""}
    <p class="hint" style="margin-top:14px">ˉ 1 ровный · ˊ 2 вверх · ˇ 3 вниз-вверх · ˋ 4 резко вниз · лёгкий — короткий, без тона</p>
  </div>`;
}
function pickTone(si,k){
  const q=ui.tone; if(q.done) return; q.pick[si]=k;
  const syl=q.w.tn.split("");
  if(syl.every((_,i)=>q.pick[i])){
    q.done=true; q.ok = syl.every((t,i)=>q.pick[i]===t);
    S.tones.n++; if(q.ok) S.tones.ok++;
    syl.forEach((t,i)=>{ if(q.pick[i]!==t){ const key=TONE_NAME[t].split(" ")[0]+">"+TONE_NAME[q.pick[i]].split(" ")[0]; S.tones.conf[key]=(S.tones.conf[key]||0)+1; } });
    const c=S.cards[q.w.id]; if(c){ c.seen++; if(q.ok) c.right++; }
    markDay(); save(); speakQuiet(q.w.w);
  }
  render();
}

/* ---------- КНИГИ ---------- */
const BOOKS = {zh:BOOKS_ZH, en:BOOKS_EN};
const BLVL = {1:["🟢","Лёгкая"], 2:["🟡","Средняя"], 3:["🔴","Сложная"]};
const LVL_HINT = {zh:{1:"HSK 1–2",2:"HSK 3",3:"HSK 4"}, en:{1:"A1–A2",2:"B1",3:"B2"}};
const BOOK_DECK = "📚 Слова из книг";
function allBooks(){ return BOOKS[S.lang].concat(S.mybooks[S.lang]||[]); }
function findBook(id){ return allBooks().find(b=>b.id===id); }
// нормализуем строку книги: {s, p, r, para}
function bline(b, a){ return S.lang==="zh" ? {s:a[0], p:a[1], r:a[2], para:!!a[3]} : {s:a[0], p:"", r:a[1], para:!!a[2]}; }

/* словарь для поиска слов в тексте */
let DICTMAP = {zh:null, en:null};
function dictMap(l){
  if(DICTMAP[l] && DICTMAP[l].v===ALL[l]) return DICTMAP[l].m;
  const m = new Map(); for(const w of ALL[l]){ const k = l==="en"?w.w.toLowerCase():w.w; if(!m.has(k)) m.set(k,w); }
  DICTMAP[l] = {v:ALL[l], m}; return m;
}
function segZh(text){
  const m = dictMap("zh"), out=[]; let i=0;
  while(i<text.length){
    const c=text[i];
    if(!/[一-鿿]/.test(c)){ out.push({t:c}); i++; continue; }
    let len=Math.min(4,text.length-i), hit=null;
    for(;len>=1;len--){ const sub=text.substr(i,len); if(/^[一-鿿]+$/.test(sub) && (m.has(sub)||len===1)){ hit=sub; break; } }
    out.push({t:hit, w:true}); i+=hit.length;
  }
  return out;
}
const IRR = {was:"be",were:"be",is:"be",are:"be",am:"be",been:"be",saw:"see",seen:"see",came:"come",went:"go",gone:"go",took:"take",taken:"take",gave:"give",given:"give",found:"find",had:"have",has:"have",did:"do",does:"do",said:"say",told:"tell",thought:"think",knew:"know",known:"know",made:"make",left:"leave",felt:"feel",began:"begin",begun:"begin",ran:"run",sat:"sit",fell:"fall",children:"child",men:"man",women:"woman",broke:"break",broken:"break",hid:"hide",hidden:"hide",brought:"bring",bought:"buy",got:"get",kept:"keep",stood:"stand",shook:"shake",shot:"shoot",grew:"grow",dug:"dig",wrote:"write",heard:"hear",met:"meet",lay:"lie",flew:"fly",spent:"spend",sang:"sing",won:"win",lost:"lose",paid:"pay",sold:"sell",held:"hold",led:"lead",meant:"mean",built:"build",caught:"catch",taught:"teach",fought:"fight",slept:"sleep",swam:"swim",drank:"drink",ate:"eat",wore:"wear",drove:"drive",rode:"ride",woke:"wake",chose:"choose",stole:"steal",forgot:"forget",lit:"light",him:"he",her:"she",them:"they",me:"i",better:"good",best:"good",worse:"bad",worst:"bad",feet:"foot",teeth:"tooth",mice:"mouse"};
function lookupEn(raw){
  const m = dictMap("en"); let w = raw.toLowerCase().replace(/’/g,"'").replace(/'s$/,"");
  const cands = [w, IRR[w]];
  if(w.endsWith("ies")) cands.push(w.slice(0,-3)+"y");
  if(w.endsWith("es")) cands.push(w.slice(0,-2));
  if(w.endsWith("s")) cands.push(w.slice(0,-1));
  if(w.endsWith("ied")) cands.push(w.slice(0,-3)+"y");
  if(w.endsWith("ed")){ cands.push(w.slice(0,-2), w.slice(0,-1)); if(/(.)\1ed$/.test(w)) cands.push(w.slice(0,-3)); }
  if(w.endsWith("ing")){ cands.push(w.slice(0,-3), w.slice(0,-3)+"e"); if(/(.)\1ing$/.test(w)) cands.push(w.slice(0,-4)); }
  if(w.endsWith("ly")) cands.push(w.slice(0,-2));
  if(w.endsWith("er")) cands.push(w.slice(0,-2), w.slice(0,-1));
  if(w.endsWith("est")) cands.push(w.slice(0,-3));
  for(const c of cands) if(c && m.has(c)) return m.get(c);
  return null;
}
function tokens(text){
  if(S.lang==="zh") return segZh(text);
  return text.split(/([A-Za-z]+(?:['’][A-Za-z]+)?)/).filter(Boolean).map(t=>/[A-Za-z]/.test(t)?{t, w:true}:{t});
}
function bookProgress(b){ const p=S.books[b.id]; return p ? (p.done ? 100 : Math.round(((p.pos||0)+1)/b.text.length*100)) : 0; }

      ${ui.bgen&&ui.bgen.err?`<div class="warn-note" style="margin-top:6px">${esc(ui.bgen.err)}</div>`:""}</div>`:""}`;

function markBook(){

function stopBook(){ const B=ui.book; B.token++; B.playing=false; B.cur=-1; stopSpeaking(); }
async function readBook(from){
  const B=ui.book, b=findBook(B.id); if(!b) return;
  stopSpeaking(); const token=++B.token; B.playing=true; B.sheet=null; render(); markDay();
  const lines=b.text.map(a=>bline(b,a));
  for(let i=from;i<lines.length;i++){
    if(token!==B.token) return;
    B.cur=i; markBook();
    try{ await speak(lines[i].s, {slow:B.slow}); }catch(e){ if(token===B.token){ B.playing=false; B.cur=-1; markBook(); } return; }
    if(token!==B.token) return;
    const p = S.books[b.id] = S.books[b.id]||{}; p.pos=Math.max(p.pos||0,i);
    await sleep(lines[i].para && i+1<lines.length && lines[i+1].para ? 500 : 250);
  }
  if(token===B.token){ B.playing=false; B.cur=-1; const p=S.books[b.id]=S.books[b.id]||{}; p.done=true; save(); render(); }
}
function openSheet(i, j){

function curSent(){ const d=S.sdeck[S.lang]; return d ? SENT[S.lang][d] : allSent(S.lang); }
function touch(id, ok){ const c=S.cards[id]; if(c){ c.seen++; if(ok) c.right++; else c.due=Math.min(c.due,Date.now()); } markDay(); save(); }
function newPh(){
  const pool = curSent(); const mode = S.pmode;
  const p = {key:S.lang+"|"+S.sdeck[S.lang]+"|"+mode, mode, i:0, score:0, done:0};
  if(mode==="cards"){
    const due = shuffle(dueList(pool)); const fresh = newList(pool).slice(0, Math.max(0, 10-due.length));
    p.queue = due.concat(fresh); p.flipped=false;
  } else {
    p.items = shuffle(pool).slice(0, Math.min(10,pool.length));
    if(mode==="build") prepBuild(p);
    if(mode==="listen") prepListen(p);
    if(mode==="type"){ p.val=""; p.result=null; }
  }
  ui.ph = p;
}
function prepBuild(p){
  const s = p.items[p.i]; if(!s) return;
  let order = shuffle(s.tokens.map((_,i)=>i));
  if(s.tokens.length>1){ let n=0; while(order.every((v,i)=>s.tokens[v]===s.tokens[i]) && n++<10) order=shuffle(order); }
  p.order=order; p.picked=[]; p.result=null;
}
function prepListen(p){
  const s = p.items[p.i]; if(!s) return;
  const others = shuffle(allSent(S.lang).filter(x=>x.id!==s.id)).slice(0,3);
  p.opts = shuffle([s,...others]); p.answered=null;
}

function phPick(ti){
  const p=ui.ph, s=p.items[p.i]; if(p.result || p.picked.includes(ti)) return;
  p.picked.push(ti);
  if(p.picked.length===s.tokens.length){
    const ok = p.picked.map(i=>s.tokens[i]).join(" ")===s.tokens.join(" ");
    p.result = ok?"ok":"bad"; if(ok) p.score++; touch(s.id, ok); speakQuiet(s.w);
  }
  render();
}
function phNext(){ const p=ui.ph; p.i++; if(p.mode==="build") prepBuild(p); else if(p.mode==="listen") prepListen(p); else { p.val=""; p.result=null; } render(); }
const CONTR = {"i'm":"i am","you're":"you are","it's":"it is","that's":"that is","what's":"what is","don't":"do not","didn't":"did not","i'll":"i will","i'd":"i would","i've":"i have","let's":"let us","can't":"cannot","isn't":"is not","we're":"we are","they're":"they are"};
function normEn(x){ return x.toLowerCase().replace(/[’`]/g,"'").replace(/[.,?!;:]/g," ").split(/\s+/).filter(Boolean).map(w=>CONTR[w]||w).join(" "); }
function lev(a,b){ const m=a.length,n=b.length; let prev=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
function checkType(skip){
  const p=ui.ph, s=p.items[p.i]; const val = skip ? "" : (document.getElementById("pti")?.value||"");
  p.val=val; let res="bad";
  if(val.trim()){
    let a,b;
    if(S.lang==="zh"){
      const hz = /[\u4e00-\u9fff]/.test(val);
      a = hz ? val.replace(/[\s。？！，,.?!]/g,"") : stripTones(val);
      b = hz ? s.w.replace(/[。？！，]/g,"") : stripTones(s.t);
    } else { a=normEn(val); b=normEn(s.w); }
    if(a===b) res="ok"; else if(lev(a,b) <= Math.max(1, Math.floor(b.length/12))) res="typo";
  }
  p.result=res; if(res!=="bad") p.score++; touch(s.id, res!=="bad"); render(); speakQuiet(s.w);
}
