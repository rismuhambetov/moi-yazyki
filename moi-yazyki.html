<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои языки — китайский и английский</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1b18; --muted:#6f6a61; --line:#e4dfd5;
  --accent:#c8372d; --accent-soft:#f9e4e1; --good:#2f7d4f; --good-soft:#e1f1e7; --warn:#b7791f;
  --radius:16px;
}
.en{--accent:#2b5cab; --accent-soft:#e2eaf7;}
@media (prefers-color-scheme:dark){
  :root{--bg:#15140f; --card:#211f1a; --ink:#f1ede4; --muted:#a39d91; --line:#36332c;
    --accent-soft:#3a1f1c; --good-soft:#1b3326;}
  .en{--accent-soft:#1c2840;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--muted)}
.langs{display:flex;gap:8px}
.lang{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;font-weight:600}
.lang.on{background:var(--accent);border-color:var(--accent);color:#fff}
nav.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:9px 2px;border-radius:9px;cursor:pointer;font:inherit;font-weight:600;font-size:13px;min-width:0}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.deck{border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:var(--card);text-align:left;font:inherit;color:inherit}
.deck:hover{border-color:var(--accent)}
.deck.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.deck h3{margin:0 0 4px;font-size:15px}
.deck small{color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:9px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.btn{border:0;background:var(--accent);color:#fff;padding:12px 18px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.flash{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;user-select:none;padding:10px}
.big{font-size:64px;line-height:1.1;font-weight:500}
.zh .big{font-family:"Noto Sans SC",sans-serif;font-size:84px}
.en .big{font-size:44px;font-weight:700}
.sub{color:var(--muted);font-size:18px}
.mean{font-size:22px;font-weight:600}
.ex{color:var(--muted);font-size:15px;max-width:520px}
.ex .zhx{font-family:"Noto Sans SC",sans-serif;color:var(--ink);font-size:18px}
.hint{font-size:13px;color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grades button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 4px;font:inherit;font-weight:600;cursor:pointer}
.grades button small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.grades .g0{border-color:#d9534f55}.grades .g3{border-color:#2f7d4f66}
.speak{border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:999px;width:42px;height:42px;cursor:pointer;font-size:18px}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px;text-align:left;font:inherit;cursor:pointer}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:#d9534f22;border-color:#d9534f}
.opt .zhx{font-family:"Noto Sans SC",sans-serif;font-size:22px}
.progress{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
input.type{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:18px;background:var(--bg);color:var(--ink)}
.list{display:grid;gap:6px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.item .w{font-weight:600;min-width:70px}
.zh .item .w{font-family:"Noto Sans SC",sans-serif;font-size:22px}
.item .m{color:var(--muted);font-size:14px}
.lvl{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--muted);white-space:nowrap}
.lvl.l2{background:#b7791f22;color:var(--warn)}
.lvl.l3{background:var(--good-soft);color:var(--good)}
.muted{color:var(--muted)}
.done{font-size:48px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.sent{font-size:30px;line-height:1.35;font-weight:600;text-align:center}
.zh .sent{font-family:"Noto Sans SC",sans-serif;font-size:36px;font-weight:500}
.slot{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.slot.ok{border-color:var(--good);background:var(--good-soft)}
.slot.bad{border-color:#d9534f;background:#d9534f14}
.tok{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px;font:inherit;font-size:18px;cursor:pointer}
.zh .tok{font-family:"Noto Sans SC",sans-serif;font-size:22px}
.tok.used{visibility:hidden}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.modes button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px;font:inherit;font-weight:600;cursor:pointer;font-size:14px}
.modes button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div>
      <h1>Мои языки</h1>
      <div class="sync" id="sync">Прогресс хранится в этом браузере</div>
    </div>
    <div class="langs">
      <button class="lang" data-lang="zh">🇨🇳 中文</button>
      <button class="lang" data-lang="en">🇬🇧 English</button>
    </div>
  </header>
  <nav class="tabs">
    <button data-tab="home">Главная</button>
    <button data-tab="cards">Карточки</button>
    <button data-tab="phrases">Фразы</button>
    <button data-tab="quiz">Тест</button>
    <button data-tab="write">Написание</button>
    <button data-tab="words">Слова</button>
  </nav>
  <main id="view"></main>
</div>

let dbRef = null, saveTimer = null, saving = false, pending = false;
function save(){
  lsSave();
  if(!dbRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 800);
}
async function flush(){
  if(saving){ pending = true; return; }
  saving = true;
  try{ await dbRef.set({state: JSON.stringify(S), updated: Date.now()}); setSync("☁️ Прогресс синхронизирован"); }
  catch(e){ setSync("Прогресс хранится в этом браузере"); }
  saving = false;
  if(pending){ pending=false; flush(); }
}
function setSync(t){ document.getElementById("sync").textContent = t; }

async function initCloud(){
  try{
    if(!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    dbRef = db.collection("data/users/"+id).doc("progress");
    let timer; const timeout = new Promise((_,rej)=>{ timer=setTimeout(()=>rej("timeout"),10000); });
    const snap = await Promise.race([dbRef.get(), timeout]); clearTimeout(timer);
    let data = snap;
    if(snap && typeof snap.data === "function") data = snap.data();
    else if(snap && snap.data && typeof snap.data === "object") data = snap.data;
    if(data && data.state){
      const remote = JSON.parse(data.state);
      const keep = {lang:S.lang, tab:S.tab};
      Object.assign(S, remote, keep);
      lsSave(); render();
    } else {
      flush();
    }
    setSync("☁️ Прогресс синхронизирован");
  }catch(e){ /* остаёмся на localStorage */ }
}

/* ---------- ИНТЕРВАЛЬНОЕ ПОВТОРЕНИЕ (SM-2 упрощённо) ---------- */
function card(id){ return S.cards[id] || null; }
function grade(id, q){ // q: 0 снова, 1 трудно, 2 хорошо, 3 легко
  const c = S.cards[id] || {ef:2.5, iv:0, reps:0, due:0, seen:0, right:0};
  c.seen++; if(q>=2) c.right++;
  if(q===0){ c.reps=0; c.iv=0; c.due=Date.now()+60*1000; }
  else {
    c.reps++;
    if(c.reps===1) c.iv = q===3?3:1;
    else if(c.reps===2) c.iv = q===3?7:(q===1?2:4);
    else c.iv = Math.max(1, Math.round(c.iv * (q===1?1.2:(q===3?c.ef*1.3:c.ef))));
    c.ef = Math.max(1.3, c.ef + (q===3?0.15:q===1?-0.15:0));
    c.due = today() + c.iv*DAY;
  }
  S.cards[id]=c;
  markDay();
  save();
}
function markDay(){ const t=today(); if(!S.days.includes(t)){ S.days.push(t); S.days=S.days.slice(-400);} }
function streak(){
  const set=new Set(S.days); let d=today(), n=0;
  if(!set.has(d)) d-=DAY;
  while(set.has(d)){ n++; d-=DAY; }
  return n;
}
function level(id){ const c=card(id); if(!c) return 0; if(c.iv>=21) return 3; if(c.iv>=3) return 2; return 1; }
const LVL = ["новое","учу","знаю","выучено"];
function dueList(words){ const now=Date.now(); return words.filter(w=>{const c=card(w.id); return c && c.due<=now;}); }
function newList(words){ return words.filter(w=>!card(w.id)); }

function curSent(){ const d=S.sdeck[S.lang]; return d ? SENT[S.lang][d] : allSent(S.lang); }
function touch(id, ok){ const c=S.cards[id]; if(c){ c.seen++; if(ok) c.right++; else c.due=Math.min(c.due,Date.now()); } markDay(); save(); }
function newPh(){
  const pool = curSent(); const mode = S.pmode;
  const p = {key:S.lang+"|"+S.sdeck[S.lang]+"|"+mode, mode, i:0, score:0, done:0};
  if(mode==="cards"){
    const due = shuffle(dueList(pool)); const fresh = newList(pool).slice(0, Math.max(0, 10-due.length));
    p.queue = due.concat(fresh); p.flipped=false;
  } else {
    p.items = shuffle(pool).slice(0, Math.min(10,pool.length));
    if(mode==="build") prepBuild(p);
    if(mode==="listen") prepListen(p);
    if(mode==="type"){ p.val=""; p.result=null; }
  }
  ui.ph = p;
}
function prepBuild(p){
  const s = p.items[p.i]; if(!s) return;
  let order = shuffle(s.tokens.map((_,i)=>i));
  if(s.tokens.length>1){ let n=0; while(order.every((v,i)=>s.tokens[v]===s.tokens[i]) && n++<10) order=shuffle(order); }
  p.order=order; p.picked=[]; p.result=null;
}
function prepListen(p){
  const s = p.items[p.i]; if(!s) return;
  const others = shuffle(allSent(S.lang).filter(x=>x.id!==s.id)).slice(0,3);
  p.opts = shuffle([s,...others]); p.answered=null;
}
function renderPhrases(v){

  const modes = `<div class="modes"><button data-pmode="cards" class="${p.mode==="cards"?"on":""}">🃏 Карточки</button><button data-pmode="build" class="${p.mode==="build"?"on":""}">🧩 Собери</button><button data-pmode="listen" class="${p.mode==="listen"?"on":""}">🎧 На слух</button><button data-pmode="type" class="${p.mode==="type"?"on":""}">✍️ Перевод</button></div>`;
  const reveal = s => `<div class="sent">${esc(s.w)}</div>${s.t?`<div class="sub">${esc(s.t)}</div>`:""}<div class="mean">${esc(s.m)}</div>`;
  let body = "";

  if(p.mode==="cards"){
    if(!p.queue.length){
      body = `<div class="panel center"><div class="done">🎉</div><h2>Фразы на сегодня повторены</h2><p class="muted">Попробуй «Собери» или «На слух».</p><button class="btn ghost" data-phmore>Ещё 10 новых фраз</button></div>`;
    } else {
      const s = p.queue[0]; const isNew=!card(s.id);
      body = `<div class="panel"><div class="progress"><span>Осталось: ${p.queue.length}</span><span>Сделано: ${p.done}</span></div>
        <div class="flash" data-phflip>${p.flipped?reveal(s):`<div class="sent">${esc(s.w)}</div>${isNew?'<span class="lvl">новая фраза</span>':""}<div class="hint">Попробуй понять сам, потом нажми — покажу перевод</div>`}</div>
        <div class="row" style="justify-content:center">${speakBtn(s.w)}</div>
        ${p.flipped?`<div class="grades"><button class="g0" data-pgrade="0">Снова</button><button data-pgrade="1">Трудно</button><button data-pgrade="2">Хорошо</button><button class="g3" data-pgrade="3">Легко</button></div>`:""}</div>`;
    }
  } else if(p.i>=p.items.length){
    const pct=Math.round(p.score/p.items.length*100);
    body = `<div class="panel center"><div class="done">${pct>=80?"🏆":pct>=50?"👍":"💪"}</div><h2>${p.score} из ${p.items.length}</h2><button class="btn" data-phrestart>Ещё раз</button></div>`;
  } else if(p.mode==="build"){
    const s = p.items[p.i];
    const built = p.picked.map(i=>s.tokens[i]);
    body = `<div class="panel"><div class="progress"><span>${p.i+1} из ${p.items.length}</span><span>Верно: ${p.score}</span></div>
      <div class="center"><div class="hint">Собери предложение:</div><div class="mean" style="font-size:24px">${esc(s.m)}</div></div>
      <div class="slot ${p.result==="ok"?"ok":p.result==="bad"?"bad":""}">${built.length?p.picked.map((ti,k)=>`<button class="tok" data-unpick="${k}" ${p.result?"disabled":""}>${esc(s.tokens[ti])}</button>`).join(""):'<span class="hint">Нажимай на слова ниже по порядку</span>'}</div>
      <div class="chips" style="justify-content:center">${p.order.map(ti=>`<button class="tok ${p.picked.includes(ti)?"used":""}" data-pick="${ti}" ${p.result?"disabled":""}>${esc(s.tokens[ti])}</button>`).join("")}</div>
      ${p.result?`<div class="center" style="margin-top:10px">${p.result==="ok"?"✅ Верно!":"❌ Правильно так:"}${reveal(s)}</div>
        <div class="row" style="justify-content:center;margin-top:12px">${speakBtn(s.w)}<button class="btn" data-phnext>Дальше →</button></div>`
        :`<div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" data-phgiveup>Показать ответ</button></div>`}</div>`;
  } else if(p.mode==="type"){
    const s = p.items[p.i];
    body = `<div class="panel"><div class="progress"><span>${p.i+1} из ${p.items.length}</span><span>Верно: ${p.score}</span></div>
      <div class="center" style="margin:10px 0 14px"><div class="hint">Переведи на ${zh?"китайский":"английский"}:</div><div class="mean" style="font-size:26px">${esc(s.m)}</div>
      ${zh?'<div class="hint">Можно иероглифами или пиньинем без тонов: wo jiao anna</div>':""}</div>
      <form id="ptf"><input class="type" id="pti" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(p.val)}" ${p.result?"disabled":""} placeholder="${zh?"我叫… / wo jiao…":"Type the sentence…"}"></form>
      ${p.result?`<div class="center" style="margin-top:12px">${p.result==="ok"?"✅ Верно!":p.result==="typo"?"🟡 Почти! Небольшая опечатка. Правильно:":"❌ Правильно так:"}${reveal(s)}</div>
        <div class="row" style="justify-content:center;margin-top:12px">${speakBtn(s.w)}<button class="btn" data-phnext>Дальше →</button></div>`
        :`<div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" data-phskip>Не знаю</button><button class="btn" data-phcheck>Проверить</button></div>`}</div>`;
  } else {
    const s = p.items[p.i];
    body = `<div class="panel"><div class="progress"><span>${p.i+1} из ${p.items.length}</span><span>Верно: ${p.score}</span></div>
      <div class="flash" style="min-height:150px">${p.answered!==null?`<div class="sent">${esc(s.w)}</div>${s.t?`<div class="sub">${esc(s.t)}</div>`:""}`
        :`<button class="btn" data-say="${esc(s.w)}" style="font-size:20px;padding:16px 26px">▶ Слушать</button><div class="hint">Послушай и выбери перевод</div>`}</div>
      <div class="opts">${p.opts.map((o,i)=>{let c=""; if(p.answered!==null){ if(o.id===s.id) c="right"; else if(i===p.answered) c="wrong"; }
        return `<button class="opt ${c}" data-phans="${i}" ${p.answered!==null?"disabled":""}>${i+1}. ${esc(o.m)}</button>`;}).join("")}</div>
      ${p.answered!==null?`<div class="row" style="justify-content:flex-end;margin-top:14px">${speakBtn(s.w)}<button class="btn" data-phnext>Дальше →</button></div>`:""}</div>`;
  }
  v.innerHTML = chips + modes + body;
  if(p.mode==="type" && !p.result) setTimeout(()=>{ const i=document.getElementById("pti"); if(i) i.focus(); },0);
}
function phPick(ti){
  const p=ui.ph, s=p.items[p.i]; if(p.result || p.picked.includes(ti)) return;
  p.picked.push(ti);
  if(p.picked.length===s.tokens.length){
    const ok = p.picked.map(i=>s.tokens[i]).join(" ")===s.tokens.join(" ");
    p.result = ok?"ok":"bad"; if(ok) p.score++; touch(s.id, ok); speak(s.w);
  }
  render();
}
function phNext(){ const p=ui.ph; p.i++; if(p.mode==="build") prepBuild(p); else if(p.mode==="listen") prepListen(p); else { p.val=""; p.result=null; } render(); }
const CONTR = {"i'm":"i am","you're":"you are","it's":"it is","that's":"that is","what's":"what is","don't":"do not","didn't":"did not","i'll":"i will","i'd":"i would","i've":"i have","let's":"let us","can't":"cannot","isn't":"is not","we're":"we are","they're":"they are"};
function normEn(x){ return x.toLowerCase().replace(/[’`]/g,"'").replace(/[.,?!;:]/g," ").split(/\s+/).filter(Boolean).map(w=>CONTR[w]||w).join(" "); }
function lev(a,b){ const m=a.length,n=b.length; let prev=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
function checkType(skip){
  const p=ui.ph, s=p.items[p.i]; const val = skip ? "" : (document.getElementById("pti")?.value||"");
  p.val=val; let res="bad";
  if(val.trim()){
    let a,b;
    if(S.lang==="zh"){
      const hz = /[\u4e00-\u9fff]/.test(val);
      a = hz ? val.replace(/[\s。？！，,.?!]/g,"") : stripTones(val);
      b = hz ? s.w.replace(/[。？！，]/g,"") : stripTones(s.t);
    } else { a=normEn(val); b=normEn(s.w); }
    if(a===b) res="ok"; else if(lev(a,b) <= Math.max(1, Math.floor(b.length/12))) res="typo";
  }
  p.result=res; if(res!=="bad") p.score++; touch(s.id, res!=="bad"); render(); speak(s.w);
}

        <div><b>Фразы целиком</b><br><span class="muted" style="font-size:14px">${allSent(S.lang).length} предложений · выучено ${allSent(S.lang).filter(s=>level(s.id)>=2).length} · к повторению ${dueList(allSent(S.lang)).length}</span></div>

function startSession(){
  const words = currentWords();
  const due = shuffle(dueList(words));
  const fresh = newList(words).slice(0, Math.max(0, S.dailyGoal - due.length));
  const queue = due.concat(fresh).slice(0, Math.max(S.dailyGoal, due.length));
  ui.session = {queue, i:0, flipped:false, done:0, total:queue.length};
}
function renderCards(v){
  if(!ui.session || ui.session.lang!==S.lang || ui.session.deck!==S.deck[S.lang]){ startSession(); ui.session.lang=S.lang; ui.session.deck=S.deck[S.lang]; }
  const s = ui.session;
  if(!s.queue.length){
    const words=currentWords(); const next = words.map(w=>card(w.id)).filter(Boolean).sort((a,b)=>a.due-b.due)[0];
    v.innerHTML = `<div class="panel center"><div class="done">🎉</div><h2>На сегодня всё!</h2>
      <p class="muted">Новых и просроченных карточек в этой теме нет.${next?`<br>Следующее повторение: ${new Date(next.due).toLocaleDateString("ru-RU")}`:""}</p>
      <div class="row" style="justify-content:center"><button class="btn ghost" data-go="quiz">Пройти тест</button><button class="btn ghost" data-more>Ещё 10 новых</button></div></div>`;
    return;
  }
  const w = s.queue[0];
  const isNew = !card(w.id);
  const front = `<div class="big">${esc(w.w)}</div>${isNew?'<span class="lvl">новое слово</span>':""}`;
  const back = `<div class="big">${esc(w.w)}</div><div class="sub">${esc(w.t)}</div><div class="mean">${esc(w.m)}</div>
    <div class="ex">${S.lang==="zh"?`<div class="zhx">${esc(w.ex)}</div><div>${esc(w.exT)}</div>`:`<div style="color:var(--ink)">${esc(w.ex)}</div>`}<div>${esc(w.exM)}</div></div>`;
  const iv = id => { const c=card(id)||{ef:2.5,iv:0,reps:0}; return c; };
  const c = iv(w.id);
  const pv = q => { if(q===0) return "<1 мин"; let n; if(c.reps===0) n = q===3?3:1; else if(c.reps===1) n = q===3?7:(q===1?2:4); else n = Math.max(1,Math.round(c.iv*(q===1?1.2:(q===3?c.ef*1.3:c.ef)))); return n+" дн"; };
  v.innerHTML = `<div class="panel">
    <div class="progress"><span>Осталось: ${s.queue.length}</span><span>Сделано: ${s.done}</span></div>
    <div class="flash" data-flip>${s.flipped?back:front}
      ${s.flipped?"":'<div class="hint">Нажми или пробел — показать ответ</div>'}</div>
    <div class="row" style="justify-content:center">${speakBtn(w.w)}${s.flipped?speakBtn(w.ex).replace("🔊","💬"):""}</div>
    ${s.flipped?`<div class="grades">
      <button class="g0" data-grade="0">Снова<small>${pv(0)}</small></button>
      <button data-grade="1">Трудно<small>${pv(1)}</small></button>
      <button data-grade="2">Хорошо<small>${pv(2)}</small></button>
      <button class="g3" data-grade="3">Легко<small>${pv(3)}</small></button></div>
      <p class="hint center">Клавиши 1–4</p>`:""}
  </div>`;
}
function doGrade(q){
  const s = ui.session; const w = s.queue.shift();
  grade(w.id, q); s.done++; s.flipped=false;
  if(q===0) s.queue.splice(Math.min(3, s.queue.length), 0, w);
  render();
}

function newQuiz(){
  const pool = currentWords(); const all = allOf(S.lang);
  const qs = shuffle(pool).slice(0, Math.min(10, pool.length)).map((w,i)=>{
    const dir = i%2 ? "rev" : "fwd"; // fwd: слово → перевод; rev: перевод → слово
    const others = shuffle(all.filter(x=>x.id!==w.id && x.m!==w.m)).slice(0,3);
    return {w, dir, opts: shuffle([w,...others])};
  });
  ui.quiz = {qs, i:0, score:0, answered:null, lang:S.lang, deck:S.deck[S.lang]};
}
function renderQuiz(v){
  if(!ui.quiz || ui.quiz.lang!==S.lang || ui.quiz.deck!==S.deck[S.lang]) newQuiz();
  const z = ui.quiz;
  if(z.i>=z.qs.length){
    const pct = Math.round(z.score/z.qs.length*100);
    v.innerHTML = `<div class="panel center"><div class="done">${pct>=80?"🏆":pct>=50?"👍":"💪"}</div>
      <h2>${z.score} из ${z.qs.length}</h2><p class="muted">${pct>=80?"Отлично!":pct>=50?"Неплохо, продолжай!":"Повтори карточки и попробуй снова."}</p>
      <button class="btn" data-newquiz>Ещё тест</button></div>`;
    return;
  }
  const q = z.qs[z.i]; const zh = S.lang==="zh";
  const prompt = q.dir==="fwd"
    ? `<div class="big">${esc(q.w.w)}</div>${z.answered!==null?`<div class="sub">${esc(q.w.t)}</div>`:""}`
    : `<div class="mean" style="font-size:28px">${esc(q.w.m)}</div>`;
  const label = o => q.dir==="fwd" ? esc(o.m) : (zh?`<span class="zhx">${esc(o.w)}</span> <span class="muted">${z.answered!==null?esc(o.t):""}</span>`:esc(o.w));
  v.innerHTML = `<div class="panel">
    <div class="progress"><span>Вопрос ${z.i+1} из ${z.qs.length}</span><span>Верно: ${z.score}</span></div>
    <div class="flash" style="min-height:150px">${prompt}<div class="hint">${q.dir==="fwd"?"Выбери перевод":"Выбери слово"}</div></div>
    <div class="row" style="justify-content:center">${q.dir==="fwd"||z.answered!==null?speakBtn(q.w.w):""}</div>
    <div class="opts">${q.opts.map((o,i)=>{
      let cls=""; if(z.answered!==null){ if(o.id===q.w.id) cls="right"; else if(i===z.answered) cls="wrong"; }
      return `<button class="opt ${cls}" data-ans="${i}" ${z.answered!==null?"disabled":""}>${i+1}. ${label(o)}</button>`;}).join("")}</div>
    ${z.answered!==null?`<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-nextq>Дальше →</button></div>`:""}
  </div>`;
}
function answer(i){
  const z=ui.quiz; if(z.answered!==null) return;
  z.answered=i; const q=z.qs[z.i]; const ok = q.opts[i].id===q.w.id;
  if(ok) z.score++;
  const c = S.cards[q.w.id]; if(c){ c.seen++; if(ok) c.right++; else { c.due=Math.min(c.due, Date.now()); } }
  markDay(); save(); render();
  if(q.dir==="fwd") speak(q.w.w);
}

function newWrite(){
  const pool = shuffle(currentWords()).slice(0,10);
  ui.write = {pool, i:0, score:0, result:null, val:"", lang:S.lang, deck:S.deck[S.lang]};
}
function renderWrite(v){

      ${zh?`<div class="big">${esc(w.w)}</div><div class="hint">Напиши пиньинь (тоны можно не ставить: ni hao)</div>`

    </div>

    ${r.result?`<p class="center" style="font-size:18px">${r.result==="ok"?"✅ Верно!":"❌ Правильно:"} <b>${esc(zh?w.t:w.w)}</b> ${zh?"— "+esc(w.m):""}</p>
      <div class="row" style="justify-content:center">${speakBtn(w.w)}<button class="btn" data-nextw>Дальше →</button></div>`
      :`<div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" data-skipw>Не знаю</button><button class="btn" data-checkw>Проверить</button></div>`}
  </div>`;
  if(!r.result) setTimeout(()=>{ const i=$("#wi"); if(i) i.focus(); },0);

function checkWrite(skip){
  const r=ui.write; const w=r.pool[r.i]; const val = skip?"":($("#wi")?.value||"");
  r.val = val;
  const ok = S.lang==="zh" ? stripTones(val)===stripTones(w.t) && val.trim()!=="" : val.trim().toLowerCase()===w.w.toLowerCase();
  r.result = ok?"ok":"bad"; if(ok) r.score++;
  const c=S.cards[w.id]; if(c){ c.seen++; if(ok) c.right++; else c.due=Math.min(c.due,Date.now()); }
  markDay(); save(); render(); speak(w.w);
}

/* ---------- СОБЫТИЯ ---------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("button,a,[data-flip],[data-phflip]"); if(!t) return;
  if(t.dataset.say!==undefined){ e.stopPropagation(); speak(t.dataset.say); return; }
  if(t.dataset.lang){ S.lang=t.dataset.lang; save(); render(); return; }
  if(t.dataset.tab){ S.tab=t.dataset.tab; save(); render(); return; }
  if(t.dataset.go){ S.tab=t.dataset.go; render(); return; }
  if(t.dataset.deck!==undefined){ e.preventDefault(); S.deck[S.lang]=t.dataset.deck||null; save(); render(); return; }
  if(t.hasAttribute("data-flip")){ if(ui.session && !ui.session.flipped){ ui.session.flipped=true; render(); speak(ui.session.queue[0].w);} return; }
  if(t.dataset.grade){ doGrade(+t.dataset.grade); return; }
  if(t.hasAttribute("data-more")){ const fresh=newList(currentWords()).slice(0,10); ui.session.queue=fresh; render(); return; }
  if(t.dataset.sdeck!==undefined){ S.sdeck[S.lang]=t.dataset.sdeck||null; save(); render(); return; }
  if(t.dataset.pmode){ S.pmode=t.dataset.pmode; save(); render(); return; }
  if(t.hasAttribute("data-phflip")){ const p=ui.ph; if(p && !p.flipped){ p.flipped=true; render(); speak(p.queue[0].w);} return; }
  if(t.dataset.pgrade){ const p=ui.ph; const s=p.queue.shift(); const q=+t.dataset.pgrade; grade(s.id,q); p.done++; p.flipped=false; if(q===0) p.queue.splice(Math.min(3,p.queue.length),0,s); render(); return; }
  if(t.hasAttribute("data-phmore")){ ui.ph.queue = newList(curSent()).slice(0,10); render(); return; }
  if(t.hasAttribute("data-phrestart")){ newPh(); render(); return; }
  if(t.dataset.pick!==undefined){ phPick(+t.dataset.pick); return; }
  if(t.dataset.unpick!==undefined){ const p=ui.ph; if(!p.result){ p.picked.splice(+t.dataset.unpick,1); render(); } return; }
  if(t.hasAttribute("data-phgiveup")){ const p=ui.ph, s=p.items[p.i]; p.picked=s.tokens.map((_,i)=>i); p.result="bad"; touch(s.id,false); speak(s.w); render(); return; }
  if(t.dataset.phans!==undefined){ const p=ui.ph; if(p.answered!==null) return; p.answered=+t.dataset.phans; const s=p.items[p.i]; const ok=p.opts[p.answered].id===s.id; if(ok) p.score++; touch(s.id,ok); render(); return; }
  if(t.hasAttribute("data-phnext")){ phNext(); return; }
  if(t.hasAttribute("data-phcheck")){ checkType(false); return; }
  if(t.hasAttribute("data-phskip")){ checkType(true); return; }
  if(t.dataset.ans!==undefined){ answer(+t.dataset.ans); return; }
  if(t.hasAttribute("data-nextq")){ ui.quiz.i++; ui.quiz.answered=null; render(); return; }
  if(t.hasAttribute("data-newquiz")){ newQuiz(); render(); return; }
  if(t.hasAttribute("data-checkw")){ checkWrite(false); return; }
  if(t.hasAttribute("data-skipw")){ checkWrite(true); return; }
  if(t.hasAttribute("data-nextw")){ const r=ui.write; r.i++; r.result=null; r.val=""; render(); return; }
  if(t.hasAttribute("data-newwrite")){ newWrite(); render(); return; }
});
document.addEventListener("submit", e=>{ e.preventDefault(); if(S.tab==="phrases" && ui.ph && ui.ph.mode==="type"){ if(!ui.ph.result) checkType(false); return; } if(S.tab==="write"){ if(ui.write.result){ ui.write.i++; ui.write.result=null; ui.write.val=""; render(); } else checkWrite(false);} });
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT"){ return; }
  if(S.tab==="cards" && ui.session && ui.session.queue.length){
    if(e.code==="Space"){ e.preventDefault(); if(!ui.session.flipped){ ui.session.flipped=true; render(); speak(ui.session.queue[0].w);} }
    else if(ui.session.flipped && "1234".includes(e.key)){ doGrade(+e.key-1); }
  } else if(S.tab==="quiz" && ui.quiz){
    if(ui.quiz.answered===null && "1234".includes(e.key)) answer(+e.key-1);
    else if(ui.quiz.answered!==null && (e.key==="Enter"||e.code==="Space")){ e.preventDefault(); ui.quiz.i++; ui.quiz.answered=null; render(); }
  } else if(S.tab==="phrases" && ui.ph && ui.ph.mode==="type" && ui.ph.result && e.key==="Enter"){ phNext();
  } else if(S.tab==="write" && ui.write && ui.write.result && e.key==="Enter"){ ui.write.i++; ui.write.result=null; ui.write.val=""; render(); }
});
try{ speechSynthesis.onvoiceschanged = ()=>{}; }catch(e){}

lsLoad(); render(); initCloud();
</script>
